<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#8b5732">
  <title>あおの きょうりゅう はっくつたい</title>
  <style>
    :root{--ink:#573720;--paper:#fff5d5;--sand:#d59b50;--orange:#f09a3e;--green:#8fc15d}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;overscroll-behavior:none}
    body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:linear-gradient(#bde4df 0 32%,#d6a863 32%);display:flex;justify-content:center;touch-action:manipulation}
    button{font:inherit;color:inherit}
    .app{width:min(100%,580px);min-height:100dvh;padding:max(9px,env(safe-area-inset-top)) 11px max(11px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
    header{display:flex;align-items:center;justify-content:space-between;gap:8px}
    h1{font-size:clamp(18px,5.1vw,28px);line-height:1.15;margin:0;text-shadow:0 2px #fff9}
    .counter{flex:none;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:5px 10px;font-weight:900;box-shadow:0 3px #765035}
    .mission{text-align:center;background:#fff8dcdd;border:2px solid #765035;border-radius:12px;padding:4px 8px;font-size:14px;font-weight:900}
    .stage{position:relative;flex:1;min-height:410px;border:5px solid #765035;border-radius:22px;overflow:hidden;background:var(--sand);box-shadow:0 7px #4f321f,0 12px 18px #51331f55;touch-action:none}
    canvas{display:block;width:100%;height:100%;cursor:crosshair}
    .message{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:94%;padding:7px 13px;border-radius:999px;background:#fff9e9ed;border:2px solid #68432b;font-weight:900;text-align:center;pointer-events:none;opacity:0;transition:.2s;z-index:2}
    .message.show{opacity:1;transform:translate(-50%,2px)}
    .legend{position:absolute;bottom:7px;left:7px;background:#fff9e5d8;border:2px solid #765035;border-radius:10px;padding:4px 7px;font-size:11px;font-weight:900;pointer-events:none}
    .toolbar{display:grid;grid-template-columns:1fr 1fr .78fr;gap:7px}
    .tool{min-height:62px;border:3px solid var(--ink);border-radius:17px;background:#fff2c8;box-shadow:0 4px #765035;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;gap:4px;padding:5px}
    .tool span{font-size:27px}.tool:active{transform:translateY(3px);box-shadow:0 1px #765035}.tool.selected{background:#ffb548;outline:3px solid white}.tool.hint{background:#bce386}
    .tip{text-align:center;font-weight:900;font-size:12px;margin:0}
    .overlay{position:fixed;inset:0;background:#17392fdf;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.overlay.open{display:flex;animation:fade .3s}
    .card{width:min(100%,540px);max-height:95dvh;overflow:auto;background:var(--paper);border:5px solid var(--ink);border-radius:25px;padding:14px;text-align:center;box-shadow:0 13px 32px #0008}
    .card h2{font-size:clamp(25px,7vw,38px);margin:0;color:#a54725}.card h3{font-size:clamp(21px,6vw,30px);margin:2px}.card p{font-weight:900;margin:3px 0 6px}
    .museum{position:relative;background:linear-gradient(#172e36 0 68%,#263c36 68%);border:3px solid #775a3c;border-radius:16px;padding:7px;margin:6px 0 8px;overflow:hidden;min-height:285px}
    .museum:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 8%,#fff9 0,#fff1 17%,transparent 55%),linear-gradient(90deg,transparent 48%,#ffffff18 49%,#ffffff18 51%,transparent 52%);pointer-events:none}
    .museum:after{content:"";position:absolute;left:8%;right:8%;bottom:18px;height:15px;border-radius:50%;background:#0008;filter:blur(7px)}
    .figure{display:none;position:relative;z-index:1;width:100%;height:auto;max-height:45dvh;filter:drop-shadow(0 7px 4px #0007)}
    .figure.active{display:block}
    .figure .skeleton-art{opacity:1;transform:scale(1);transition:opacity .8s,transform .8s}
    .figure .living-art{opacity:0;transform:scale(.92);transition:opacity 1s,transform 1s}
    .figure.reveal .skeleton-art{opacity:0;transform:scale(1.04)}
    .figure.reveal .living-art{opacity:1;transform:scale(1)}
    .bone-main{fill:url(#boneGradient);stroke:#5d4934;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .bone-line{fill:none;stroke:#ead7aa;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
    .bone-dark{fill:none;stroke:#5d4934;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
    .bone-detail{fill:none;stroke:#7b6347;stroke-width:3;stroke-linecap:round}
    .label-plate{display:inline-flex;align-items:center;gap:6px;background:#f5e5b5;border:2px solid #62442e;border-radius:9px;padding:4px 10px;font-weight:900;font-size:12px;margin-top:-3px;position:relative;z-index:2}
    .sparkles{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0}
    .sparkles.show{opacity:1}
    .sparkles i{position:absolute;font-style:normal;animation:spark 1.15s ease-out both}
    .sparkles i:nth-child(1){left:12%;top:18%;animation-delay:.05s}.sparkles i:nth-child(2){left:78%;top:16%;animation-delay:.2s}.sparkles i:nth-child(3){left:68%;top:55%;animation-delay:.35s}.sparkles i:nth-child(4){left:24%;top:57%;animation-delay:.5s}.sparkles i:nth-child(5){left:48%;top:8%;animation-delay:.65s}
    .actions{display:grid;grid-template-columns:1fr 1.25fr;gap:8px}
    .view-toggle,.again{border:3px solid var(--ink);border-radius:16px;padding:9px 10px;font-weight:900;font-size:16px;box-shadow:0 4px #765035}
    .view-toggle{background:#bce386}.again{background:var(--orange)}
    .view-toggle:active,.again:active{transform:translateY(3px);box-shadow:0 1px #765035}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes spark{0%{transform:scale(0) rotate(0);opacity:0}35%{transform:scale(1.5) rotate(25deg);opacity:1}100%{transform:scale(.4) rotate(75deg);opacity:0}}
    @media(max-height:680px){.stage{min-height:300px}.tool{min-height:52px}.tip{display:none}.mission{font-size:12px}.museum{min-height:230px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <header><h1>🦖 あおの きょうりゅう はっくつたい</h1><div class="counter" aria-live="polite">🦴 <b id="count">0</b> / 8</div></header>
    <div class="mission">こんかいの きょうりゅう：<b id="targetName">？？？</b></div>
    <section class="stage" id="stage" aria-label="砂と岩を掘る発掘エリア">
      <canvas id="dig"></canvas><div class="message" id="message" aria-live="polite"></div>
      <div class="legend">🪨 岩＝ハンマー　✨ 骨の仕上げ＝ブラシ</div>
    </section>
    <div class="toolbar">
      <button class="tool selected" id="brush" type="button" aria-pressed="true"><span>🖌️</span>ブラシ</button>
      <button class="tool" id="hammer" type="button" aria-pressed="false"><span>🔨</span>ハンマー</button>
      <button class="tool hint" id="hint" type="button"><span>💡</span>ヒント</button>
    </div>
    <p class="tip">岩をハンマーでこわして、さいごはブラシで骨をきれいにしよう！</p>
  </main>

  <div class="overlay" id="complete" role="dialog" aria-modal="true" aria-labelledby="completeTitle"><div class="card">
    <h2 id="completeTitle">🎉 はっくつ せいこう！</h2><h3 id="resultName"></h3>
    <p id="resultText">8この ほねが そろったよ！</p>
    <div class="museum">
      <div class="sparkles" id="sparkles"><i>✨</i><i>⭐</i><i>✨</i><i>⭐</i><i>✨</i></div>

      <svg id="trex" class="figure" viewBox="0 0 600 330" role="img" aria-label="ティラノサウルスの骨格と生きていた姿">

          <linearGradient id="trexSkin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#688c48"/><stop offset=".55" stop-color="#41633b"/><stop offset="1" stop-color="#243f31"/></linearGradient>
        </defs>
        <g class="skeleton-art">
          <path class="bone-dark" d="M35 182C145 184 211 165 285 135S409 92 468 91"/>
          <path class="bone-line" d="M35 182C145 184 211 165 285 135S409 92 468 91"/>

          <path class="bone-dark" d="M310 196l-33 76 2 42m93-116 43 69-5 47M279 311h-48m179 2h52M399 152l30 31 37 6m-76-22 17 38 35 18"/>
          <path class="bone-line" d="M310 196l-33 76 2 42m93-116 43 69-5 47M279 311h-48m179 2h52M399 152l30 31 37 6m-76-22 17 38 35 18"/>
        </g>
        <g class="living-art">
          <path fill="url(#trexSkin)" stroke="#20382d" stroke-width="6" d="M27 190Q135 196 226 166 302 139 343 111 401 69 471 70L453 49Q524 21 580 57L595 91 561 125 489 125Q463 149 425 169L449 205 416 213 382 188Q344 218 292 211L268 274 224 305 185 300 232 264 245 201Q174 206 101 205Z"/>
          <path fill="#88aa57" d="M474 75q58-33 103-5l8 17-47-4-40 10z" opacity=".75"/>
          <path fill="#d5e59c" d="M260 177q71 35 146-15-50 64-130 57z" opacity=".55"/>
          <circle cx="548" cy="65" r="7" fill="#f7d24d"/><circle cx="550" cy="65" r="3" fill="#17231d"/>
          <path fill="none" stroke="#1e3028" stroke-width="5" d="M503 102q38 12 72-5"/>
          <path fill="#f4efe0" d="M526 104l9 16 7-14 10 15 7-17"/>
          <path fill="none" stroke="#20382d" stroke-width="12" stroke-linecap="round" d="M394 173l36 27m-51-10 23 32"/>
          <path fill="none" stroke="#20382d" stroke-width="18" stroke-linecap="round" d="M292 205l-29 78-35 18m148-101 39 73-10 30"/>
        </g>
      </svg>

      <svg id="triceratops" class="figure" viewBox="0 0 600 330" role="img" aria-label="トリケラトプスの骨格と生きていた姿">
        <defs><linearGradient id="triSkin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c38a4b"/><stop offset=".55" stop-color="#9b6438"/><stop offset="1" stop-color="#6a4530"/></linearGradient></defs>
        <g class="skeleton-art">
          <path class="bone-dark" d="M28 173C134 186 207 167 287 139S403 111 468 116"/><path class="bone-line" d="M28 173C134 186 207 167 287 139S403 111 468 116"/>
          <path class="bone-main" d="M421 65Q474 17 540 46 580 67 585 116L551 151 463 140 410 101Z"/>
          <path class="bone-dark" d="M523 76l41-48m-72 47 4-53m54 93 43 15"/><path class="bone-line" d="M523 76l41-48m-72 47 4-53m54 93 43 15"/>
          <circle cx="538" cy="96" r="7" fill="#26332d"/>
          <path class="bone-main" d="M270 119Q355 71 433 123 456 177 405 209 317 236 249 179Z"/>
          <path class="bone-detail" d="M395 117q11 83-51 112m24-113q5 83-53 111m26-100q-3 71-51 92m25-77q-7 54-40 69"/>
          <path class="bone-dark" d="M292 198l-30 69-1 46m111-113 34 67 1 46M261 312h-47m193 1h45"/>
          <path class="bone-line" d="M292 198l-30 69-1 46m111-113 34 67 1 46M261 312h-47m193 1h45"/>
        </g>
        <g class="living-art">
          <path fill="url(#triSkin)" stroke="#563923" stroke-width="6" d="M25 180Q124 199 236 178 301 106 411 111L418 78Q466 20 536 46 577 69 586 114L556 154 482 151Q456 181 423 194L395 272 361 309 327 304 363 264 371 202Q315 224 257 207L223 276 184 309 150 302 193 264 205 204Q119 207 53 194Z"/>

          <circle cx="535" cy="99" r="7" fill="#f4d54f"/><circle cx="537" cy="99" r="3" fill="#241b13"/>
          <path fill="none" stroke="#563923" stroke-width="18" stroke-linecap="round" d="M240 201l-34 76-34 25m207-101 31 76-10 27"/>
        </g>
      </svg>

      <svg id="stegosaurus" class="figure" viewBox="0 0 600 330" role="img" aria-label="ステゴサウルスの骨格と生きていた姿">
        <defs><linearGradient id="stegoSkin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#79a66b"/><stop offset=".55" stop-color="#4f7658"/><stop offset="1" stop-color="#2f5047"/></linearGradient></defs>
        <g class="skeleton-art">
          <path class="bone-dark" d="M475 145C392 99 310 111 225 145S78 171 29 147M31 147L7 122m25 25L5 164"/><path class="bone-line" d="M475 145C392 99 310 111 225 145S78 171 29 147M31 147L7 122m25 25L5 164"/>
          <path class="bone-main" d="M456 118Q517 94 573 130L584 158 540 181 469 163 439 140Z"/><circle cx="548" cy="138" r="6" fill="#26332d"/>
          <path class="bone-main" d="M215 119Q319 57 438 120 467 177 414 213 302 246 198 179Z"/>
          <path class="bone-detail" d="M405 116q9 82-52 112m23-118q4 89-61 123m31-117q-3 87-61 117m29-106q-7 73-52 101m24-85q-8 57-40 79"/>
          <path class="bone-main" d="M229 117l-5-48 38 37m-2-9 9-58 37 59m4-4 25-58 27 71m11-1 36-48 13 67m13 2 35-30-4 46"/>
          <path class="bone-dark" d="M256 201l-30 69 3 43m159-111 34 67-3 44M229 313h-45m235 0h48"/><path class="bone-line" d="M256 201l-30 69 3 43m159-111 34 67-3 44M229 313h-45m235 0h48"/>
        </g>
        <g class="living-art">
          <path fill="url(#stegoSkin)" stroke="#263f39" stroke-width="6" d="M12 164L53 145Q132 177 210 153 290 85 410 113 464 124 489 144L463 111Q527 90 579 128L591 157 548 183 482 171Q449 205 405 215L380 280 347 311 312 306 350 270 360 219Q295 234 226 209L199 275 160 308 127 302 166 264 176 201Q98 200 42 183Z"/>
          <path fill="#d3a35d" stroke="#5f4a31" stroke-width="5" d="M214 151l-12-65 54 46 7-76 53 65 29-73 37 82 45-61 15 78"/>
          <path fill="#8fbe7d" d="M210 173q107 42 218-11-63 70-185 57z" opacity=".45"/>
          <circle cx="553" cy="140" r="6" fill="#f1d14d"/><circle cx="555" cy="140" r="3" fill="#1b2925"/>
          <path fill="#e0b369" stroke="#5f4a31" stroke-width="5" d="M47 151L8 112 55 137zm1 10L4 174 53 171z"/>
          <path fill="none" stroke="#263f39" stroke-width="18" stroke-linecap="round" d="M222 208l-30 70-33 25m229-93 31 70-8 24"/>
        </g>
      </svg>
    </div>
    <div class="label-plate">🏛️ <span id="plateName"></span>・はくぶつかん展示</div>
    <div class="actions">
      <button class="view-toggle" id="viewToggle" type="button">🦴 ほねを見る</button>
      <button class="again" id="again" type="button">つぎを はっくつする</button>
    </div>
  </div></div>

  <script>
  (()=>{
    'use strict';
    const canvas=document.querySelector('#dig'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage');
    const countEl=document.querySelector('#count'),message=document.querySelector('#message'),complete=document.querySelector('#complete');
    const brushBtn=document.querySelector('#brush'),hammerBtn=document.querySelector('#hammer');
    const resultText=document.querySelector('#resultText'),viewToggle=document.querySelector('#viewToggle'),sparkles=document.querySelector('#sparkles');
    const dinos=[{id:'trex',name:'ティラノサウルス'},{id:'triceratops',name:'トリケラトプス'},{id:'stegosaurus',name:'ステゴサウルス'}];
    let W=0,H=0,dpr=1,tool='brush',dragging=false,bones=[],grains=[],dino,highlight=null,audio=null,msgTimer=0,hintTimer=0,drawQueued=false,revealTimer=0;
    const boneShapes=[
      p=>{p.ellipse(0,0,24,16,0,0,7);p.moveTo(16,-10);p.lineTo(34,-15);p.lineTo(29,1);p.lineTo(17,9)},
      p=>{p.moveTo(-28,0);p.lineTo(28,0);[-21,-7,7,21].forEach(x=>{p.moveTo(x,-10);p.lineTo(x,10)})},
      p=>{p.moveTo(-27,-15);p.quadraticCurveTo(0,24,27,-15);p.moveTo(-14,-1);p.lineTo(14,-1)},
      p=>{p.moveTo(-30,0);p.lineTo(30,0);p.moveTo(-27,-8);p.lineTo(-27,8);p.moveTo(27,-8);p.lineTo(27,8)},
      p=>{p.ellipse(-13,0,15,19,0,0,7);p.ellipse(13,0,15,19,0,0,7)},
      p=>{p.moveTo(-24,-16);p.lineTo(0,0);p.lineTo(-22,19);p.moveTo(0,0);p.lineTo(27,14)},
      p=>{p.moveTo(-28,-10);p.quadraticCurveTo(0,13,29,5);p.moveTo(-7,3);p.lineTo(-14,18)},
      p=>{p.moveTo(-29,9);p.quadraticCurveTo(0,-20,29,5);p.moveTo(19,0);p.lineTo(33,-10)}
    ];
    function activeFigure(){return document.querySelector('.figure.active')}
    function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
    function reset(){
      clearTimeout(revealTimer);
      dino=dinos[Math.floor(Math.random()*dinos.length)];
      document.querySelector('#targetName').textContent=dino.name;
      document.querySelector('#resultName').textContent=dino.name;
      document.querySelector('#plateName').textContent=dino.name;
      document.querySelectorAll('.figure').forEach(x=>{x.classList.toggle('active',x.id===dino.id);x.classList.remove('reveal')});
      viewToggle.textContent='🦴 ほねを見る';resultText.textContent='8この ほねが そろったよ！';sparkles.classList.remove('show');
      bones=[];grains=[];highlight=null;countEl.textContent=0;complete.classList.remove('open');
      const mx=55,my=48,cw=(W-mx*2)/2,ch=(H-my*2)/4;
      for(let i=0;i<8;i++){const rock=i%2===0;bones.push({x:mx+cw*(i%2+.22+Math.random()*.56),y:my+ch*(Math.floor(i/2)+.22+Math.random()*.56),angle:(Math.random()-.5)*1.3,shape:i,rock,rockHP:rock?100:0,clean:0,found:false})}
      for(let i=0;i<180;i++)grains.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*4,a:.1+Math.random()*.3,dug:0});
      draw();say('「'+dino.name+'」を さがそう！')
    }
    function pathFor(b){const p=new Path2D();boneShapes[b.shape](p);return p}
    function rockPath(b){const p=new Path2D();const r=38;p.moveTo(b.x-r,b.y+10);p.lineTo(b.x-r*.7,b.y-r*.65);p.lineTo(b.x-r*.1,b.y-r);p.lineTo(b.x+r*.72,b.y-r*.55);p.lineTo(b.x+r,b.y+r*.25);p.lineTo(b.x+r*.45,b.y+r*.8);p.lineTo(b.x-r*.5,b.y+r*.75);p.closePath();return p}
    function draw(){
      drawQueued=false;if(!W||!H)return;const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#e6bc76');bg.addColorStop(1,'#c78a45');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
      grains.forEach(g=>{if(g.dug<1){ctx.globalAlpha=g.a*(1-g.dug);ctx.fillStyle='#75492b';ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,7);ctx.fill()}});ctx.globalAlpha=1;
      bones.forEach(b=>{
        if(b.rock&&b.rockHP>0){const p=rockPath(b);ctx.fillStyle=b.rockHP>55?'#77756c':'#8c8678';ctx.strokeStyle='#4e4a43';ctx.lineWidth=4;ctx.fill(p);ctx.stroke(p);if(b.rockHP<75){ctx.strokeStyle='#d4c6a4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x-18,b.y-20);ctx.lineTo(b.x,b.y-3);ctx.lineTo(b.x-13,b.y+15);ctx.moveTo(b.x,b.y-3);ctx.lineTo(b.x+19,b.y+11);ctx.stroke()}return}
        if(b.clean>0){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);ctx.globalAlpha=.25+b.clean/135;ctx.fillStyle='#f4e4b5';ctx.strokeStyle='#695139';ctx.lineWidth=4;const p=pathFor(b);ctx.fill(p);ctx.stroke(p);if(!b.found){ctx.globalAlpha=Math.max(0,.95-b.clean/100);ctx.fillStyle='#b77b3e';ctx.fillRect(-39,-28,78,56)}ctx.restore()}
      });
      if(highlight){ctx.save();ctx.strokeStyle='#fff329';ctx.lineWidth=5;ctx.setLineDash([8,7]);ctx.beginPath();ctx.arc(highlight.x,highlight.y,43+Math.sin(Date.now()/130)*4,0,7);ctx.stroke();ctx.restore();queueDraw()}
    }
    function queueDraw(){if(!drawQueued){drawQueued=true;requestAnimationFrame(draw)}}
    function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
    function dig(x,y){
      unlockAudio();const radius=tool==='hammer'?51:33;grains.forEach(g=>{const d=Math.hypot(g.x-x,g.y-y);if(d<radius)g.dug=Math.min(1,g.dug+(1-d/radius)*(tool==='brush'?.5:.25))});
      let touched=false,wrong='';
      bones.forEach(b=>{if(b.found)return;const dist=Math.hypot(b.x-x,b.y-y);if(dist>radius+23)return;touched=true;
        if(b.rockHP>0){if(tool==='hammer'){b.rockHP=Math.max(0,b.rockHP-22);tone(90,.07,.045);if(b.rockHP===0){say('🪨 岩が こわれた！ ブラシの でばん！');crack()}}else wrong='この岩は ハンマーで こわそう！';return}
        if(tool==='hammer'){wrong='骨のまわりは ブラシで やさしく！';return}
        b.clean=Math.min(100,b.clean+10*(1-dist/(radius+28)));if(b.clean>=100){b.clean=100;b.found=true;found()}
      });
      if(wrong)say(wrong);if(!touched)tone(tool==='hammer'?105:245,.035,.02);draw()
    }
    function found(){const n=bones.filter(b=>b.found).length;countEl.textContent=n;say('🦴 ほねを みつけた！');chime();if(n===8)setTimeout(win,650)}
    function showLiving(){
      const fig=activeFigure();if(!fig)return;fig.classList.add('reveal');sparkles.classList.remove('show');void sparkles.offsetWidth;sparkles.classList.add('show');
      resultText.textContent='ほねから すがたが よみがえった！';viewToggle.textContent='🦴 ほねを見る';victory()
    }
    function win(){
      const fig=activeFigure();if(fig)fig.classList.remove('reveal');
      complete.classList.add('open');sparkles.classList.remove('show');resultText.textContent='8この ほねが そろったよ！';
      victory();revealTimer=setTimeout(showLiving,1500);document.querySelector('#again').focus()
    }
    function choose(next){tool=next;brushBtn.classList.toggle('selected',next==='brush');hammerBtn.classList.toggle('selected',next==='hammer');brushBtn.setAttribute('aria-pressed',next==='brush');hammerBtn.setAttribute('aria-pressed',next==='hammer');say(next==='brush'?'ブラシで 骨をきれいに！':'ハンマーで 岩をこわそう！')}
    function say(t){clearTimeout(msgTimer);message.textContent=t;message.classList.add('show');msgTimer=setTimeout(()=>message.classList.remove('show'),1450)}
    function unlockAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}
    function tone(f,d,v=.06,delay=0,type='sine'){if(!audio)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d)}
    function crack(){tone(75,.12,.08,0,'square');tone(55,.16,.07,.08,'square')}function chime(){[523,659,784].forEach((f,i)=>tone(f,.3,.08,i*.09))}function victory(){[523,659,784,1047].forEach((f,i)=>tone(f,.5,.1,i*.14))}
    canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId);const p=point(e);dig(p.x,p.y)});
    canvas.addEventListener('pointermove',e=>{if(dragging){const p=point(e);dig(p.x,p.y)}});
    canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
    brushBtn.addEventListener('click',()=>choose('brush'));hammerBtn.addEventListener('click',()=>choose('hammer'));
    document.querySelector('#hint').addEventListener('click',()=>{unlockAudio();const left=bones.filter(b=>!b.found);if(!left.length)return;highlight=left[Math.floor(Math.random()*left.length)];say(highlight.rockHP>0?'ひかる岩を ハンマーで！':'ひかる場所を ブラシで！');tone(880,.25,.06);clearTimeout(hintTimer);hintTimer=setTimeout(()=>{highlight=null;draw()},2400);draw()});
    viewToggle.addEventListener('click',()=>{
      clearTimeout(revealTimer);const fig=activeFigure();if(!fig)return;const living=fig.classList.toggle('reveal');
      resultText.textContent=living?'ほねから すがたが よみがえった！':'8この ほねが そろったよ！';
      viewToggle.textContent=living?'🦴 ほねを見る':'🦖 すがたを見る'
    });
    document.querySelector('#again').addEventListener('click',reset);addEventListener('resize',resize,{passive:true});requestAnimationFrame(()=>{resize();reset()});
  })();
  </script>
</body>
</html>
