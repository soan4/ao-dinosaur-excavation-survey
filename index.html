<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あおの きょうりゅう はっくつたい visual v3</title>
<style>html,body{margin:0;min-height:100%;background:#3f2b1c;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.loading{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px;color:#fff1cf}.error{color:#ffd0c2}</style>
</head>
<body>
<div class="loading" id="loading"><div><b>🦖 visual v3 を準備しています</b><p>ゲーム性はそのまま、UIをリマスター中…</p></div></div>
<script>
(async()=>{
try{
  const url='https://raw.githubusercontent.com/soan4/ao-dinosaur-excavation-survey/34f88617a7057c1fe75676fdd363806bb64d3850/index.html';
  const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('gameplay-v2 を読み込めませんでした');
  let src=await res.text();
  const visualCss=String.raw`
  :root{--v3-ink:#4a2b16;--v3-paper:#f7e7b6;--v3-paper2:#fff5d6;--v3-edge:#6b411f;--v3-gold:#d69a3a;--v3-blue:#257fc2;--v3-green:#75b83d;--v3-shadow:#2d1a0c88}
  body{background:radial-gradient(circle at 50% 0,#6b4a2b 0,#3f2b1c 42%,#26180f 100%)!important}
  .app{background:linear-gradient(180deg,#6e4929 0,#52341f 12%,#3a281b 100%);border-left:1px solid #9a6a3d55;border-right:1px solid #21140b99;box-shadow:0 0 38px #0007;padding-left:12px!important;padding-right:12px!important}
  header{background:linear-gradient(#fff4cf,#ecd290);border:3px solid var(--v3-edge);border-radius:16px;padding:7px 9px;box-shadow:inset 0 2px #fff9,inset 0 -4px #b8884666,0 5px 0 #3a210f88,0 8px 16px #0004}
  h1{color:var(--v3-ink);text-shadow:0 1px #fff8!important;letter-spacing:.02em}
  .counter{background:linear-gradient(#fff9d9,#eacb83)!important;border:3px solid var(--v3-edge)!important;color:var(--v3-ink)!important;box-shadow:inset 0 2px #fff, inset 0 -4px #b78545aa,0 4px 0 #3c230f99!important;padding:7px 13px!important}
  .mission{background:linear-gradient(#fff6d8,#eed49a)!important;border:3px solid var(--v3-edge)!important;color:var(--v3-ink)!important;border-radius:14px!important;box-shadow:inset 0 2px #fff9,inset 0 -3px #b7864666,0 4px 0 #3b220f77!important;padding:7px 9px!important}
  .polish-panel{background:linear-gradient(180deg,#fff6d8,#ead09a)!important;border:3px solid var(--v3-edge)!important;border-radius:15px!important;box-shadow:inset 0 2px #fff9,inset 0 -4px #af7d4077,0 4px 0 #38200e88!important;color:var(--v3-ink)!important}
  .polish-panel h4{color:#6c3b16;text-shadow:0 1px #fff}
  .polish-bar{background:#302b25!important;border-color:#4b2e19!important;box-shadow:inset 0 2px 4px #0009,0 1px #fff7}
  .polish-fill{background:linear-gradient(#c9ef58,#73b82f)!important;box-shadow:inset 0 2px #eaff99}
  .stage{border:6px solid #65401f!important;border-radius:25px!important;box-shadow:inset 0 0 0 3px #b47a3b77,inset 0 8px 16px #fff1c31a,0 7px 0 #2b180c,0 13px 24px #0007!important;background:#b77a39!important}
  .stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 28% 16%,#fff2bf18 0 2px,transparent 3px),radial-gradient(circle at 68% 42%,#5e361927 0 2px,transparent 3px),linear-gradient(135deg,#fff0 55%,#49291314);background-size:34px 31px,47px 43px,100% 100%;mix-blend-mode:multiply}
  .message{background:linear-gradient(#fff4cf,#e5c583)!important;border:3px solid var(--v3-edge)!important;color:var(--v3-ink)!important;box-shadow:inset 0 2px #fff,0 4px 0 #3b210f88,0 7px 12px #0003!important}
  .legend{background:linear-gradient(#fff3d0,#e7ca8d)!important;border:2px solid var(--v3-edge)!important;color:var(--v3-ink)!important;box-shadow:inset 0 1px #fff,0 2px 0 #43261488}
  .toolbar{gap:9px!important}
  .tool{position:relative;overflow:hidden;border:4px solid #503018!important;border-radius:18px!important;color:var(--v3-ink)!important;background:linear-gradient(#fff4ce,#d8bb78)!important;box-shadow:inset 0 3px #fff9,inset 0 -6px #9a682e66,0 5px 0 #321b0d,0 9px 14px #0005!important;text-shadow:0 1px #fff8}
  .tool:before{content:"";position:absolute;inset:3px 4px auto;height:38%;border-radius:12px;background:linear-gradient(#fff9,#fff0);pointer-events:none}
  .tool.selected{background:linear-gradient(#53b8f5,#1879bd)!important;color:white!important;border-color:#173f62!important;outline:3px solid #dff6ff!important;box-shadow:inset 0 3px #9edaff,inset 0 -6px #0c4d8299,0 5px 0 #102d48,0 9px 15px #0006!important;text-shadow:0 2px #164b70}
  .tool.hint{background:linear-gradient(#a8df55,#5eaa2c)!important;border-color:#365f1e!important;color:#17320e!important;box-shadow:inset 0 3px #d4f792,inset 0 -6px #3f7a2099,0 5px 0 #254314,0 9px 14px #0005!important}
  .tip{background:#2c1c12cc;color:#ffe8b6;border:1px solid #b6834a66;border-radius:10px;padding:5px 8px;text-shadow:0 1px #000}
  .card{background:linear-gradient(#fff5d8,#e6c989)!important;border:6px solid #5b351b!important;border-radius:28px!important;box-shadow:inset 0 3px #fff9,inset 0 -7px #a96f3377,0 12px 0 #2f190c99,0 22px 40px #000a!important;color:var(--v3-ink)!important}
  .card h2{color:#9d451e!important;text-shadow:0 2px #fff7}.museum{background:linear-gradient(#4c3b2c,#2f281f)!important;border:4px solid #75502d!important;box-shadow:inset 0 0 18px #0009,inset 0 2px #c49b6855!important}.again{background:linear-gradient(#ffbc52,#e5822f)!important;border:4px solid #59321a!important;color:#4b2a14!important;box-shadow:inset 0 3px #ffe3a4,inset 0 -5px #b75b2299,0 5px 0 #351c0d!important}
  .discover-pop{background:linear-gradient(#fff8d9,#eccd84)!important;border-color:#5b351b!important;color:#4a2915!important;box-shadow:inset 0 2px #fff,0 7px 0 #331b0d99,0 0 32px #ffe371aa!important}
  @media(max-width:420px){header{padding:6px 7px}.counter{padding:6px 10px!important}.tool{border-width:3px!important}.stage{border-width:5px!important}}
  `;
  const needle='document.open();document.write(page);document.close();';
  const replacement=`page=page.replace('</style>',${JSON.stringify(visualCss)}+'</style>');${needle}`;
  if(!src.includes(needle))throw new Error('visual-v3 の差し込み位置が見つかりません');
  src=src.replace(needle,replacement);
  document.open();document.write(src);document.close();
}catch(e){document.querySelector('#loading').innerHTML='<div class="error"><b>読み込みに失敗しました</b><p>'+e.message+'</p></div>'}
})();
</script>
</body>
</html>
