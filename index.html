<style>

<body><main class="app"><div class="topbar"><div class="plate">🦖 きょうりゅう はっくつたい</div><div class="counter">🦴 <b id="count">0</b> / 8</div></div><div class="mission">こんかいの きょうりゅう：<b id="targetName">ティラノサウルス</b></div><div class="status" id="status">ブラシで砂をはらって 骨をみつけよう！</div><section class="game" id="stage"><canvas id="dig"></canvas><div class="tools"><button class="tool selected" id="brush"><span class="ico">🖌️</span>ブラシ</button><button class="tool" id="hammer"><span class="ico">🔨</span>ハンマー</button></div><aside class="polish"><h3>✨ みがきちゅう！</h3><div class="stageLabel" id="stageLabel">骨を みつけよう！</div><div class="bar"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div><div class="almost" id="almost">✨ あと少し！</div></aside><div class="message" id="message"></div><div class="legend">🪨 岩はハンマー　🦴 骨はブラシ</div><button class="hint" id="hint"><span>💡</span>ヒント</button></section></main><div class="overlay" id="complete"><div class="card"><h2>🎉 はっくつ せいこう！</h2><h3 id="resultName"></h3><p>8この ほねが そろったよ！</p><div class="museum"><div><div class="museumBone">🦖</div><b id="museumText"></b></div></div><button class="again" id="again">つぎを はっくつする</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#dig'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),countEl=document.querySelector('#count'),targetName=document.querySelector('#targetName'),resultName=document.querySelector('#resultName'),message=document.querySelector('#message'),status=document.querySelector('#status'),fill=document.querySelector('#fill'),pct=document.querySelector('#pct'),stageLabel=document.querySelector('#stageLabel'),almost=document.querySelector('#almost'),complete=document.querySelector('#complete'),brushBtn=document.querySelector('#brush'),hammerBtn=document.querySelector('#hammer');
const dinos=[{id:'trex',name:'ティラノサウルス'},{id:'triceratops',name:'トリケラトプス'},{id:'stegosaurus',name:'ステゴサウルス'}],partNames=['頭骨','下あご','背骨','肋骨','骨盤','前脚','後脚','尾'];
let W=0,H=0,dpr=1,tool='brush',dragging=false,bones=[],grains=[],dino=dinos[0],msgTimer=0,audio=null,lastFx=0;
function addCircle(p,x,y,r){p.moveTo(x+r,y);p.arc(x,y,r,0,Math.PI*2)}
const common={
 jaw:p=>{p.moveTo(-34,-4);p.quadraticCurveTo(-8,20,30,7);p.lineTo(36,1);p.quadraticCurveTo(3,12,-29,-13);p.closePath()},
 spine:p=>{for(let i=0;i<6;i++){const x=-30+i*12;addCircle(p,x,0,6);p.rect(x-2,-15,4,9)}p.rect(-35,-3,70,6)},
 ribs:p=>{p.rect(-4,-24,8,48);for(let i=-2;i<=2;i++){const y=i*9;p.moveTo(-2,y);p.bezierCurveTo(-15,y+3,-25,y+11,-29,y+22);p.lineTo(-23,y+24);p.bezierCurveTo(-18,y+14,-10,y+7,0,y+5);p.moveTo(2,y);p.bezierCurveTo(15,y+3,25,y+11,29,y+22);p.lineTo(23,y+24);p.bezierCurveTo(18,y+14,10,y+7,0,y+5)}},
 pelvis:p=>{p.moveTo(-8,-11);p.bezierCurveTo(-26,-28,-39,-12,-31,7);p.bezierCurveTo(-25,21,-12,25,0,10);p.bezierCurveTo(12,25,25,21,31,7);p.bezierCurveTo(39,-12,26,-28,8,-11);p.lineTo(0,-2);p.closePath()},
 fore:p=>{addCircle(p,-22,-17,7);p.moveTo(-18,-12);p.lineTo(0,4);p.lineTo(7,-2);p.lineTo(-11,-20);p.closePath();addCircle(p,3,6,6);p.moveTo(7,9);p.lineTo(27,22);p.lineTo(31,17);p.lineTo(10,3);p.closePath()},
 hind:p=>{addCircle(p,-23,-18,8);p.moveTo(-18,-13);p.lineTo(3,3);p.lineTo(10,-5);p.lineTo(-13,-24);p.closePath();addCircle(p,5,5,7);p.moveTo(9,9);p.lineTo(21,29);p.lineTo(28,25);p.lineTo(11,2);p.closePath();p.moveTo(21,28);p.lineTo(36,31);p.lineTo(37,25);p.lineTo(25,22);p.closePath()},
 tail:p=>{for(let i=0;i<7;i++){const x=-31+i*10,r=6-i*.45;addCircle(p,x,(i-3)*1.4,r)}p.moveTo(30,-3);p.lineTo(43,1);p.lineTo(30,5);p.closePath()}
};
const shapeSets={
 trex:[
  p=>{p.moveTo(-36,-7);p.bezierCurveTo(-31,-30,6,-34,33,-18);p.lineTo(40,-5);p.lineTo(31,8);p.lineTo(11,10);p.lineTo(2,23);p.lineTo(-25,19);p.lineTo(-39,5);p.closePath()},
  common.jaw,common.spine,common.ribs,common.pelvis,
  p=>{addCircle(p,-20,-15,6);p.moveTo(-16,-10);p.lineTo(-1,3);p.lineTo(5,-2);p.lineTo(-11,-18);p.closePath();addCircle(p,2,5,5);p.moveTo(6,8);p.lineTo(20,18);p.lineTo(24,14);p.lineTo(8,2);p.closePath()},
  p=>{addCircle(p,-24,-19,9);p.moveTo(-18,-14);p.lineTo(4,3);p.lineTo(12,-6);p.lineTo(-13,-26);p.closePath();addCircle(p,6,6,7);p.moveTo(10,10);p.lineTo(23,31);p.lineTo(31,26);p.lineTo(12,2);p.closePath();p.moveTo(23,30);p.lineTo(39,33);p.lineTo(40,26);p.lineTo(27,23);p.closePath()},
  p=>{for(let i=0;i<8;i++){const x=-34+i*9,r=6.5-i*.42;addCircle(p,x,(i-3)*1.1,r)}p.moveTo(30,-3);p.lineTo(46,1);p.lineTo(30,5);p.closePath()}
 ],
 triceratops:[
  p=>{p.moveTo(-31,-5);p.bezierCurveTo(-38,-28,-15,-38,8,-30);p.bezierCurveTo(27,-25,39,-9,35,8);p.lineTo(19,16);p.lineTo(-18,14);p.closePath();p.moveTo(10,-23);p.lineTo(20,-43);p.lineTo(22,-20);p.closePath();p.moveTo(25,-13);p.lineTo(43,-27);p.lineTo(34,-7);p.closePath();p.moveTo(-20,-22);p.quadraticCurveTo(-33,-34,-38,-14);p.lineTo(-29,3);p.closePath()},
  p=>{p.moveTo(-31,-3);p.quadraticCurveTo(-7,15,27,8);p.lineTo(34,1);p.quadraticCurveTo(5,10,-27,-10);p.closePath()},
  p=>{for(let i=0;i<7;i++){const x=-32+i*10;addCircle(p,x,0,6.5);p.rect(x-2,-13,4,8)}p.rect(-37,-3,74,6)},
  p=>{p.rect(-4,-25,8,50);for(let i=-2;i<=2;i++){const y=i*9;p.moveTo(-2,y);p.bezierCurveTo(-17,y+4,-28,y+13,-32,y+24);p.moveTo(2,y);p.bezierCurveTo(17,y+4,28,y+13,32,y+24)}},
  p=>{p.moveTo(-10,-12);p.bezierCurveTo(-30,-30,-42,-9,-34,10);p.bezierCurveTo(-27,24,-12,27,0,12);p.bezierCurveTo(12,27,27,24,34,10);p.bezierCurveTo(42,-9,30,-30,10,-12);p.lineTo(0,-1);p.closePath()},
  p=>{addCircle(p,-23,-18,8);p.moveTo(-18,-13);p.lineTo(1,4);p.lineTo(9,-3);p.lineTo(-13,-25);p.closePath();addCircle(p,4,6,7);p.moveTo(8,10);p.lineTo(26,25);p.lineTo(32,19);p.lineTo(11,3);p.closePath()},
  p=>{addCircle(p,-24,-19,9);p.moveTo(-18,-14);p.lineTo(4,3);p.lineTo(12,-5);p.lineTo(-14,-26);p.closePath();addCircle(p,7,6,8);p.moveTo(11,11);p.lineTo(23,32);p.lineTo(31,27);p.lineTo(13,2);p.closePath()},
  p=>{for(let i=0;i<7;i++){const x=-31+i*10,r=6.5-i*.5;addCircle(p,x,(i-3)*1.0,r)}p.moveTo(29,-3);p.lineTo(41,1);p.lineTo(29,5);p.closePath()}
 ],
 stegosaurus:[
  p=>{p.moveTo(-32,-4);p.bezierCurveTo(-27,-18,-3,-22,20,-14);p.lineTo(36,-4);p.lineTo(29,8);p.lineTo(5,13);p.lineTo(-24,10);p.closePath()},
  p=>{p.moveTo(-28,-3);p.quadraticCurveTo(-5,12,25,6);p.lineTo(31,0);p.quadraticCurveTo(2,8,-24,-9);p.closePath()},
  p=>{for(let i=0;i<7;i++){const x=-32+i*10;addCircle(p,x,0,6);p.rect(x-2,-14,4,8)}p.rect(-37,-3,74,6);for(let i=0;i<5;i++){const x=-22+i*11;p.moveTo(x,-12);p.lineTo(x+6,-28);p.lineTo(x+11,-11);p.closePath()}},
  p=>{p.rect(-4,-23,8,46);for(let i=-2;i<=2;i++){const y=i*8;p.moveTo(-2,y);p.bezierCurveTo(-16,y+3,-26,y+10,-30,y+20);p.moveTo(2,y);p.bezierCurveTo(16,y+3,26,y+10,30,y+20)}},
  p=>{p.moveTo(-10,-10);p.bezierCurveTo(-28,-25,-38,-8,-31,8);p.bezierCurveTo(-24,20,-10,23,0,10);p.bezierCurveTo(10,23,24,20,31,8);p.bezierCurveTo(38,-8,28,-25,10,-10);p.closePath()},
  common.fore,
  p=>{addCircle(p,-22,-18,8);p.moveTo(-17,-13);p.lineTo(3,3);p.lineTo(10,-5);p.lineTo(-12,-24);p.closePath();addCircle(p,5,5,7);p.moveTo(9,10);p.lineTo(20,29);p.lineTo(28,25);p.lineTo(11,2);p.closePath()},
  p=>{for(let i=0;i<7;i++){const x=-32+i*10,r=6.3-i*.48;addCircle(p,x,(i-3)*.9,r)}p.moveTo(28,-4);p.lineTo(45,-16);p.lineTo(34,0);p.lineTo(47,13);p.lineTo(28,5);p.closePath()}
 ]
};
function pathFor(b){const p=new Path2D();shapeSets[dino.id][b.shape](p);return p}
function rockPath(b){const p=new Path2D(),r=38;p.moveTo(b.x-r,b.y-8);p.lineTo(b.x-23,b.y-32);p.lineTo(b.x+8,b.y-38);p.lineTo(b.x+35,b.y-17);p.lineTo(b.x+32,b.y+20);p.lineTo(b.x+5,b.y+37);p.lineTo(b.x-29,b.y+23);p.closePath();return p}
function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);reset()}
function reset(){document.querySelectorAll('.partTag').forEach(e=>e.remove());dino=dinos[Math.floor(Math.random()*dinos.length)];targetName.textContent=dino.name;resultName.textContent=dino.name;document.querySelector('#museumText').textContent=dino.name+'・はくぶつかん展示';bones=[];grains=[];countEl.textContent=0;complete.classList.remove('open');resetPanel();const mx=62,my=105,cw=(W-mx*2)/2,ch=(H-my-62)/4;for(let i=0;i<8;i++){const rock=i%2===0;bones.push({x:mx+cw*(i%2+.27+Math.random()*.43),y:my+ch*(Math.floor(i/2)+.25+Math.random()*.44),angle:(Math.random()-.5)*.9,shape:i,name:partNames[i],rockHP:rock?100:0,clean:0,grid:Array(48).fill(false),found:false,tag:null})}for(let i=0;i<230;i++)grains.push({x:Math.random()*W,y:Math.random()*H,r:.8+Math.random()*4,a:.08+Math.random()*.25,dug:0});draw();say(dino.name+'の骨を さがそう！')}
function drawGround(){const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#b77c43');bg.addColorStop(.45,'#8e582f');bg.addColorStop(1,'#5c351e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let i=0;i<30;i++){const x=((i*157+31)%983)/983*W,y=((i*223+17)%977)/977*H,r=2.5+((i*31)%19)/3;ctx.fillStyle='#2d1b1255';ctx.beginPath();ctx.ellipse(x+2,y+3,r*1.2,r*.75,(i%6)*.3,0,7);ctx.fill();const g=ctx.createLinearGradient(x-r,y-r,x+r,y+r);g.addColorStop(0,i%2?'#b29a78':'#9b8468');g.addColorStop(.45,i%2?'#7c6550':'#70604c');g.addColorStop(1,'#473528');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,r,r*.7,(i%6)*.3,0,7);ctx.fill()}}
function boneDetails(b){ctx.save();ctx.strokeStyle='#745736';ctx.fillStyle='#745736';ctx.lineWidth=2;ctx.globalAlpha=.65;if(b.shape===0){if(dino.id==='trex'){ctx.beginPath();ctx.ellipse(-11,-7,8,6,-.2,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(13,-9,5,4,0,0,7);ctx.fill();for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(-18+i*8,13);ctx.lineTo(-15+i*8,21);ctx.lineTo(-11+i*8,13);ctx.closePath();ctx.fill()}}else if(dino.id==='triceratops'){ctx.beginPath();ctx.ellipse(5,-5,6,5,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(25,-8);ctx.lineTo(43,-21);ctx.stroke()}else{ctx.beginPath();ctx.ellipse(3,-4,5,4,0,0,7);ctx.fill()}}ctx.restore()}
function drawBone(b){if(b.clean<=0)return;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);ctx.globalAlpha=.38+b.clean/150;const p=pathFor(b),g=ctx.createLinearGradient(-40,-32,40,35);g.addColorStop(0,'#fff2ca');g.addColorStop(.38,'#ead59f');g.addColorStop(.74,'#c8ad73');g.addColorStop(1,'#8d7047');ctx.shadowColor='#2d1b1266';ctx.shadowBlur=5;ctx.shadowOffsetX=2;ctx.shadowOffsetY=4;ctx.fillStyle=g;ctx.strokeStyle='#60482f';ctx.lineWidth=3.5;ctx.fill(p,'evenodd');ctx.stroke(p);ctx.shadowColor='transparent';boneDetails(b);if(!b.found){ctx.save();ctx.clip(p);for(let gy=0;gy<6;gy++)for(let gx=0;gx<8;gx++){const idx=gy*8+gx;if(b.grid[idx])continue;const px=-40+gx*10,py=-30+gy*10;if(b.clean<35){ctx.globalAlpha=.95;ctx.fillStyle=(gx+gy)%3?'#a46331':'#884f29';ctx.fillRect(px-1,py-1,12,12)}else if(b.clean<75){ctx.globalAlpha=.72;ctx.fillStyle=(gx+gy)%2?'#c08c58':'#b97c47';ctx.beginPath();ctx.ellipse(px+5,py+5,5,4,0,0,7);ctx.fill()}else{ctx.globalAlpha=.52;ctx.fillStyle='#9d764f';ctx.beginPath();ctx.arc(px+4,py+4,1.7+(idx%3)*.45,0,7);ctx.fill()}}ctx.restore()}ctx.restore()}
function drawRock(b){if(b.rockHP<=0)return;const p=rockPath(b),s=b.rockHP>70?0:b.rockHP>35?1:2,g=ctx.createLinearGradient(b.x-35,b.y-34,b.x+38,b.y+40);g.addColorStop(0,s===0?'#c0b6a3':s===1?'#c8bda8':'#d1c3aa');g.addColorStop(.43,s===0?'#81796c':s===1?'#918779':'#9f9583');g.addColorStop(1,s===0?'#4b4740':s===1?'#58534c':'#675f55');ctx.fillStyle=g;ctx.strokeStyle='#464139';ctx.lineWidth=4;ctx.fill(p);ctx.stroke(p);if(s>0){ctx.strokeStyle='#ead8b4';ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(b.x-20,b.y-21);ctx.lineTo(b.x-4,b.y-5);ctx.lineTo(b.x-14,b.y+17);ctx.moveTo(b.x-4,b.y-5);ctx.lineTo(b.x+20,b.y+12);ctx.stroke()}}
function draw(){drawGround();grains.forEach((g,i)=>{if(g.dug<1){ctx.globalAlpha=g.a*(1-g.dug);ctx.fillStyle=i%4===0?'#d6a661':i%4===1?'#5e3721':i%4===2?'#a76435':'#ca8a49';ctx.beginPath();ctx.ellipse(g.x,g.y,g.r*1.3,g.r*.72,(i%9)*.2,0,7);ctx.fill()}});ctx.globalAlpha=1;bones.forEach(b=>{drawBone(b);drawRock(b)})}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function say(t){status.textContent=t;message.textContent=t;message.classList.add('show');clearTimeout(msgTimer);msgTimer=setTimeout(()=>message.classList.remove('show'),1200)}function resetPanel(){fill.style.width='0%';pct.textContent='0%';stageLabel.textContent='骨を みつけよう！';almost.classList.remove('show')}function updatePanel(b){if(!b||b.rockHP>0||b.found)return;const n=Math.round(b.clean);fill.style.width=n+'%';pct.textContent=n+'%';stageLabel.textContent=b.name+'：'+(n<35?'濃い泥':n<75?'薄い泥':'細かな汚れ');almost.classList.toggle('show',n>=80&&n<100)}
function tone(f=300,d=.04,v=.018){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d+.01)}catch(e){}}
function fx(x,y,kind){const now=performance.now();if(now-lastFx<45)return;lastFx=now;const n=kind==='hammer'?5:3;for(let i=0;i<n;i++){const e=document.createElement('i');e.className='fx '+(kind==='hammer'?'rockfx':'sandfx');e.style.left=x+'px';e.style.top=y+'px';const a=-2.55+1.8*(i/Math.max(1,n-1)),d=(kind==='hammer'?34:20)+Math.random()*20;e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d+'px');e.style.setProperty('--rot',((Math.random()-.5)*220)+'deg');stage.appendChild(e);setTimeout(()=>e.remove(),600)}}
function shine(b){const e=document.createElement('div');e.className='glow';e.style.left=b.x+'px';e.style.top=b.y+'px';stage.appendChild(e);setTimeout(()=>e.remove(),820)}
function tag(b){if(b.tag)return;const e=document.createElement('div');e.className='partTag';e.textContent='🦴 '+b.name;e.style.left=b.x+'px';e.style.top=(b.y-45)+'px';stage.appendChild(e);b.tag=e;requestAnimationFrame(()=>e.classList.add('show'))}
function found(b){b.found=true;b.clean=100;shine(b);tag(b);const n=bones.filter(x=>x.found).length;countEl.textContent=n;say('✨ '+dino.name+'の'+b.name+' はっけん！ '+n+' / 8');tone(760,.12,.04);if(navigator.vibrate)navigator.vibrate(35);if(n===8)setTimeout(()=>complete.classList.add('open'),650);else setTimeout(resetPanel,500)}
function dig(x,y){fx(x,y,tool);let touched=false,wrong='';grains.forEach(g=>{const d=Math.hypot(g.x-x,g.y-y);if(d<(tool==='brush'?24:18))g.dug=Math.min(1,g.dug+(tool==='brush'?.3:.08))});for(const b of bones){if(b.found)continue;if(Math.hypot(b.x-x,b.y-y)>64)continue;touched=true;if(b.rockHP>0){if(tool==='hammer'){const before=b.rockHP;b.rockHP=Math.max(0,b.rockHP-22);tone(95,.06,.035);if(before>70&&b.rockHP<=70)say('⚡ ヒビが はいった！');else if(before>35&&b.rockHP<=35)say('🔨 おおきな ヒビ！');else if(b.rockHP===0)say('💥 パカッ！ '+b.name+'をブラシでみがこう！')}else wrong='🪨 かたい岩は ハンマー！';break}if(tool==='hammer'){wrong='🦴 '+b.name+'はブラシで やさしく！';break}b.clean=Math.max(b.clean,8);const ca=Math.cos(-b.angle),sa=Math.sin(-b.angle),dx=x-b.x,dy=y-b.y,lx=dx*ca-dy*sa,ly=dx*sa+dy*ca;let changed=false;for(let gy=0;gy<6;gy++)for(let gx=0;gx<8;gx++){const idx=gy*8+gx,cx=-35+gx*10,cy=-25+gy*10;if(!b.grid[idx]&&Math.hypot(cx-lx,cy-ly)<8){b.grid[idx]=true;changed=true}}const cleared=b.grid.reduce((s,v)=>s+(v?1:0),0);b.clean=Math.min(100,cleared/36*100);updatePanel(b);if(changed)tone(310+Math.min(150,b.clean),.025,.012);if(b.clean>=92)found(b);break}if(wrong)say(wrong);if(!touched)tone(tool==='hammer'?105:240,.03,.014);draw()}
function choose(t){tool=t;brushBtn.classList.toggle('selected',t==='brush');hammerBtn.classList.toggle('selected',t==='hammer');say(t==='brush'?'🖌️ ブラシで ゆっくり なぞろう！':'🔨 岩を たたいて ヒビをいれよう！')}
canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId);const p=point(e);dig(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!dragging||tool!=='brush')return;const p=point(e);dig(p.x,p.y)});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);brushBtn.onclick=()=>choose('brush');hammerBtn.onclick=()=>choose('hammer');document.querySelector('#hint').onclick=()=>{const b=bones.find(x=>!x.found);if(!b)return;choose(b.rockHP>0?'hammer':'brush');say('💡 '+dino.name+'の'+b.name+'は このあたり！');shine(b)};document.querySelector('#again').onclick=reset;window.addEventListener('resize',resize);requestAnimationFrame(resize)
})();
</script></body></html>
