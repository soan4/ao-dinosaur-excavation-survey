<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あおの きょうりゅう はっくつたい gameplay v2.4</title>
<style>html,body{margin:0;min-height:100%;background:#bde4df;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.loading{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px;color:#573720}.error{color:#9b3326}</style>
</head>
<body>
<div class="loading" id="loading"><div><b>🦖 gameplay v2.4 を準備しています</b><p>みがき進捗を見やすい位置へ移動しています…</p></div></div>
<script>
(async()=>{
try{
  const url='https://raw.githubusercontent.com/soan4/ao-dinosaur-excavation-survey/c51c53d0ba0f4cda5b4f8fbcb4aa4dc8f1602a1d/index.html';
  const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('ゲーム本体を読み込めませんでした');
  let page=await res.text();

  page=page.replace('const cols=8,rows=6,cw2=10,ch2=10,brushR=22;','const cols=8,rows=6,cw2=10,ch2=10,brushR=8;');
  page=page.replace('gameplay v2.1','gameplay v2.4');

  // 上段の「ほる・わる・みがく」3分割ガイドを生成しない。
  page=page.replace(/const missionNew=missionOld\+`<div class="phase-guide"[\s\S]*?<\/div>`;\n  html=html\.replace\(missionOld,missionNew\);/, "const missionNew=missionOld;\n  html=html.replace(missionOld,missionNew);");

  const marker="if(!html.includes('cleanGrid:Array(48)')||!html.includes('骨の上を なぞって'))throw new Error('ブラシ処理の組み込みに失敗しました');";
  const enhancement=`
  const polishCss=\`
  .polish-panel{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;width:100%;padding:7px 10px;background:#fff4d8eF;border:3px solid #68432b;border-radius:13px;box-shadow:0 3px #68432b55;color:#573720;min-height:54px}
  .polish-title{min-width:94px}.polish-panel h4{margin:0;font-size:14px;line-height:1.1}.polish-stage{font-size:10px;font-weight:900;line-height:1.25;margin-top:2px}
  .polish-bar{height:14px;border:2px solid #573720;border-radius:999px;background:#3e3e38;overflow:hidden;min-width:70px}
  .polish-fill{height:100%;width:0%;background:linear-gradient(90deg,#85cf39,#d2ee54);transition:width .08s linear}
  .polish-percent{font-size:21px;font-weight:900;line-height:1;min-width:48px;text-align:right}
  .almost{grid-column:1/-1;display:none;text-align:center;font-size:11px;font-weight:900;color:#a64a21;margin-top:-3px}.almost.show{display:block}
  @media(max-width:390px){.polish-panel{gap:5px;padding:6px 7px}.polish-title{min-width:82px}.polish-panel h4{font-size:12px}.polish-stage{font-size:9px}.polish-percent{font-size:18px;min-width:42px}}
  \`;
  html=html.replace('</style>',polishCss+'</style>');
  html=html.replace(missionOld, missionOld+'<div class="polish-panel" id="polishPanel"><div class="polish-title"><h4>✨ みがきちゅう！</h4><div class="polish-stage" id="polishStage">骨を みつけよう！</div></div><div class="polish-bar"><div class="polish-fill" id="polishFill"></div></div><div class="polish-percent" id="polishPercent">0%</div><div class="almost" id="almost">✨ あと少し！</div></div>');
  html=html.replace("function setPhase(next){", \`function resetPolishPanel(){
      const panel=document.querySelector('#polishPanel');if(!panel)return;
      document.querySelector('#polishFill').style.width='0%';
      document.querySelector('#polishPercent').textContent='0%';
      document.querySelector('#polishStage').textContent='骨を みつけよう！';
      document.querySelector('#almost').classList.remove('show');
    }
    function updatePolishPanel(b){
      const panel=document.querySelector('#polishPanel');if(!panel)return;
      if(!b||b.found||b.rockHP>0){return}
      const pct=Math.max(0,Math.min(100,Math.round(b.clean||0)));
      document.querySelector('#polishFill').style.width=pct+'%';
      document.querySelector('#polishPercent').textContent=pct+'%';
      document.querySelector('#polishStage').textContent=pct<35?'① 泥のかたまり':pct<75?'② うすい泥':'③ さいごの よごれ';
      document.querySelector('#almost').classList.toggle('show',pct>=80&&pct<100);
    }
    function setPhase(next){\`);
  html=html.replace("b.clean=Math.min(100,cleared/36*100);", "b.clean=Math.min(100,cleared/36*100);updatePolishPanel(b);");
  html=html.replace("bones=[];grains=[];highlight=null;countEl.textContent=0;complete.classList.remove('open');setPhase('dig');", "bones=[];grains=[];highlight=null;countEl.textContent=0;complete.classList.remove('open');setPhase('dig');resetPolishPanel();");
  html=html.replace("b.clean=100;b.found=true;found()", "b.clean=100;updatePolishPanel(b);b.found=true;found()", 1);
  `+marker;

  page=page.replace(marker,enhancement);
  if(!page.includes('brushR=8')||!page.includes('みがきちゅう！')||page.includes('missionNew=missionOld+`<div class="phase-guide"'))throw new Error('v2.4 の組み込みに失敗しました');
  document.open();document.write(page);document.close();
}catch(e){document.querySelector('#loading').innerHTML='<div class="error"><b>読み込みに失敗しました</b><p>'+e.message+'</p></div>'}
})();
</script>
</body>
</html>
