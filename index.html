<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あおの きょうりゅう はっくつたい visual v3.4</title>
<style>
html,body{margin:0;min-height:100%;background:#2d1c10;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
.loading{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px;color:#fff1cf}.error{color:#ffd0c2}
</style>
</head>
<body>
<div class="loading" id="loading"><div><b>🦖 visual v3.4 を準備しています</b><p>発掘イラストをリマスター中…</p></div></div>
<script>
(async()=>{
try{
  const url='https://raw.githubusercontent.com/soan4/ao-dinosaur-excavation-survey/34f88617a7057c1fe75676fdd363806bb64d3850/index.html';
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw new Error('gameplay-v2 を読み込めませんでした');
  let src=await res.text();

  const visualCss=`
  :root{--v3-ink:#4b2b16;--v3-edge:#6a401e;--v3-paper:#f6e3aa;--v3-gold:#d9a24a}
  body{background:radial-gradient(circle at 50% 0,#76502f 0,#3b2718 44%,#21140c 100%)!important}
  .app{background:linear-gradient(180deg,#6f492a 0,#4f321f 17%,#352318 100%)!important;box-shadow:0 0 42px #0008!important;padding-left:12px!important;padding-right:12px!important}
  header{background:linear-gradient(180deg,#fff3ca 0,#ecd08a 72%,#d7ad63 100%)!important;border:4px solid #5d3518!important;border-radius:17px!important;box-shadow:inset 0 3px #fff9,inset 0 -5px #a66d2d66,0 5px 0 #2c180b,0 9px 17px #0005!important}
  h1{color:#3f2817!important;text-shadow:0 2px #fff9,0 -1px #2d170c33!important;letter-spacing:.025em}
  .counter{background:linear-gradient(#fff8d7,#e9c87b)!important;border:4px solid #5d3518!important;color:#3f2817!important;box-shadow:inset 0 3px #fff,inset 0 -5px #a7723366,0 5px 0 #2e190c!important}
  .mission,.polish-panel,.message,.legend{background:linear-gradient(180deg,#fff4ce,#e7c786)!important;border:3px solid #65401f!important;color:#4a2a16!important;box-shadow:inset 0 2px #fff9,inset 0 -4px #a8733766,0 4px 0 #2d190c77!important}
  .mission,.polish-panel{border-radius:15px!important}.message{border-radius:999px!important}
  .polish-panel h4{color:#6b3817!important;text-shadow:0 1px #fff!important}.polish-bar{background:#31271e!important;border-color:#51321b!important;box-shadow:inset 0 3px 5px #0009,0 1px #fff8!important}.polish-fill{background:linear-gradient(180deg,#d7f65e,#69ad2c)!important;box-shadow:inset 0 2px #f3ffb0!important}
  .stage{position:relative;border:7px solid #5e381b!important;border-radius:27px!important;background:#8e5b31!important;box-shadow:inset 0 0 0 3px #b77d4077,inset 0 12px 22px #ffe0a71a,0 8px 0 #2a160b,0 17px 28px #0008!important;overflow:hidden!important}
  .stage:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(135deg,#fff6d512,transparent 38%),radial-gradient(ellipse at 50% 110%,#23110955,transparent 62%)}
  .stage:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 12% 14%,#dfb27577 0 2px,#6d43242b 3px 5px,transparent 6px),radial-gradient(circle at 74% 32%,#4f2e1c77 0 3px,#b47b4140 4px 6px,transparent 7px),radial-gradient(circle at 43% 72%,#d39d5b55 0 2px,#4c2c1933 3px 5px,transparent 6px),radial-gradient(circle at 87% 81%,#2f1b1155 0 2px,transparent 4px);background-size:37px 33px,61px 55px,43px 47px,71px 67px;mix-blend-mode:multiply;opacity:.78}
  canvas{position:relative;z-index:0;filter:saturate(.98) contrast(1.04)}
  .toolbar{gap:10px!important}.tool{position:relative;overflow:hidden;border:4px solid #543017!important;border-radius:19px!important;background:linear-gradient(180deg,#fff0c4,#d8b66d)!important;color:#452713!important;box-shadow:inset 0 3px #fff9,inset 0 -7px #96602766,0 6px 0 #2b170b,0 10px 16px #0005!important;text-shadow:0 1px #fff9!important}.tool:before{content:"";position:absolute;left:7px;right:7px;top:5px;height:38%;border-radius:13px;background:linear-gradient(#fff9,#fff0);pointer-events:none}.tool.selected{background:linear-gradient(180deg,#5dbcf1,#1677b7)!important;color:#fff!important;border-color:#173d5c!important;outline:3px solid #dff5ff!important;box-shadow:inset 0 3px #b2e5ff,inset 0 -7px #0d4c7e99,0 6px 0 #102a40,0 10px 17px #0006!important;text-shadow:0 2px #174968!important}.tool.hint{background:linear-gradient(180deg,#aee45a,#60aa2c)!important;border-color:#345d1c!important;box-shadow:inset 0 3px #e0ff9d,inset 0 -7px #3d782099,0 6px 0 #234111,0 10px 17px #0005!important}
  .tip{background:#28180fdd!important;color:#ffe9b8!important;border:2px solid #8b623a88!important;border-radius:12px!important;box-shadow:inset 0 1px #fff2!important}
  .card{background:linear-gradient(180deg,#fff4ce,#e3c37d)!important;border:7px solid #563018!important;border-radius:30px!important;box-shadow:inset 0 4px #fff9,inset 0 -9px #9b622b77,0 13px 0 #2c170b99,0 24px 42px #000a!important}.museum{background:linear-gradient(180deg,#514032,#26211c)!important;border:5px solid #75502e!important;box-shadow:inset 0 0 25px #000c,inset 0 3px #d8b07844!important}.again{background:linear-gradient(#ffc05b,#e6802c)!important;border:4px solid #5a3218!important;box-shadow:inset 0 3px #ffe7a8,inset 0 -6px #b45a2299,0 5px 0 #31190c!important}
  .dig-fx{position:absolute;z-index:7;pointer-events:none;will-change:transform,opacity}.sand-fx{width:5px;height:4px;border-radius:50%;background:#d6a15c;box-shadow:0 1px 0 #6b4025;animation:sandFly .48s ease-out forwards}.rock-fx{width:8px;height:6px;border-radius:45%;background:linear-gradient(135deg,#b8ad98,#5f584d);box-shadow:0 2px 1px #2c2017aa;animation:rockFly .5s ease-out forwards}.bone-glow{position:absolute;z-index:7;width:82px;height:82px;margin:-41px 0 0 -41px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fffde2dd 0 10%,#ffe66d99 25%,#ffc72d33 50%,transparent 72%);filter:drop-shadow(0 0 9px #fff1a5);animation:boneShine .72s ease-out forwards}.bone-glow:before,.bone-glow:after{content:'✨';position:absolute;font-size:23px}.bone-glow:before{left:1px;top:3px}.bone-glow:after{right:0;bottom:4px}@keyframes sandFly{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.35)}}@keyframes rockFly{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.55)}}@keyframes boneShine{0%{opacity:0;transform:scale(.25)}30%{opacity:1;transform:scale(1.28)}100%{opacity:0;transform:scale(1.5)}}
  @media(max-width:420px){header{border-width:3px!important}.tool{border-width:3px!important}.stage{border-width:5px!important}}
  `;

  const needle='document.open();document.write(page);document.close();';
  if(!src.includes(needle))throw new Error('ゲームへの差し込み位置が見つかりません');

  const patch=`
    page=page.replace('</style>',${JSON.stringify(visualCss)}+'</style>');

    // 発掘面を、添付イメージに近い「土・小石・陰影」の描画へ。
    page=page.replace("const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#e6bc76');bg.addColorStop(1,'#c78a45');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);",`const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#b67c43');bg.addColorStop(.45,'#8e582f');bg.addColorStop(1,'#5f371e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);const glow=ctx.createRadialGradient(W*.23,H*.13,3,W*.23,H*.13,Math.max(W,H)*.78);glow.addColorStop(0,'#f2cd8545');glow.addColorStop(.48,'#c88b4618');glow.addColorStop(1,'#321a0f22');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);for(let i=0;i<92;i++){const sx=((i*79+23)%997)/997*W,sy=((i*131+47)%991)/991*H,sr=.8+((i*17)%13)/4;ctx.globalAlpha=.14+((i*29)%16)/100;ctx.fillStyle=i%4===0?'#e2b56c':i%4===1?'#5a341f':i%4===2?'#b9783d':'#8a512d';ctx.beginPath();ctx.ellipse(sx,sy,sr*1.35,sr*.72,(i%8)*.24,0,7);ctx.fill()}ctx.globalAlpha=1;for(let i=0;i<28;i++){const px=((i*157+31)%983)/983*W,py=((i*223+17)%977)/977*H,pr=2.8+((i*31)%19)/3;ctx.fillStyle='#2f1c135c';ctx.beginPath();ctx.ellipse(px+2.5,py+3.2,pr*1.18,pr*.78,(i%6)*.29,0,7);ctx.fill();const pg=ctx.createLinearGradient(px-pr,py-pr,px+pr,py+pr);pg.addColorStop(0,i%2?'#b29a7a':'#9b8469');pg.addColorStop(.47,i%2?'#7c6651':'#71604e');pg.addColorStop(1,'#49372a');ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(px,py,pr,pr*.72,(i%6)*.29,0,7);ctx.fill();ctx.globalAlpha=.32;ctx.fillStyle='#f0dcc0';ctx.beginPath();ctx.ellipse(px-pr*.28,py-pr*.26,pr*.28,pr*.13,(i%6)*.29,0,7);ctx.fill();ctx.globalAlpha=1}`);

    page=page.replace("grains.forEach(g=>{if(g.dug<1){ctx.globalAlpha=g.a*(1-g.dug);ctx.fillStyle='#75492b';ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,7);ctx.fill()}});ctx.globalAlpha=1;",`grains.forEach((g,gi)=>{if(g.dug<1){const fade=1-g.dug;ctx.globalAlpha=g.a*fade;ctx.fillStyle=gi%4===0?'#d7a762':gi%4===1?'#603822':gi%4===2?'#a86435':'#c98949';ctx.beginPath();ctx.ellipse(g.x,g.y,g.r*1.32,g.r*.7,(gi%9)*.21,0,7);ctx.fill();if(g.r>2.8){ctx.globalAlpha=.16*fade;ctx.fillStyle='#ffe0a0';ctx.beginPath();ctx.arc(g.x-g.r*.3,g.y-g.r*.25,Math.max(.6,g.r*.24),0,7);ctx.fill()}}});ctx.globalAlpha=1;`);

    // 骨を単色から、アイボリーの陰影＋ハイライト＋斑点へ。
    page=page.replace("ctx.globalAlpha=.35+b.clean/155;ctx.fillStyle='#f4e4b5';ctx.strokeStyle='#695139';ctx.lineWidth=4;\n          const p=pathFor(b);ctx.fill(p);ctx.stroke(p);",`ctx.globalAlpha=.42+b.clean/145;const p=pathFor(b);const boneG=ctx.createLinearGradient(-38,-30,34,34);boneG.addColorStop(0,'#fff1c8');boneG.addColorStop(.36,'#ead59e');boneG.addColorStop(.72,'#c8ad74');boneG.addColorStop(1,'#8e7148');ctx.save();ctx.shadowColor='#3b251866';ctx.shadowBlur=5;ctx.shadowOffsetX=2;ctx.shadowOffsetY=4;ctx.fillStyle=boneG;ctx.strokeStyle='#654c32';ctx.lineWidth=4;ctx.fill(p);ctx.stroke(p);ctx.restore();ctx.save();ctx.clip(p);ctx.globalAlpha=.28;ctx.fillStyle='#fff9df';ctx.beginPath();ctx.ellipse(-11,-13,24,7,-.35,0,7);ctx.fill();ctx.globalAlpha=.20;ctx.fillStyle='#725136';for(let si=0;si<6;si++){const ax=-28+((si*19+b.shape*7)%53),ay=-20+((si*13+b.shape*11)%39),ar=1.2+(si%3)*.7;ctx.beginPath();ctx.arc(ax,ay,ar,0,7);ctx.fill()}ctx.restore();`);

    // 岩も平面色ではなく面のある石へ。
    page=page.replace("ctx.fillStyle=rockStage===0?'#77756c':rockStage===1?'#878277':'#989080';\n          ctx.strokeStyle='#4e4a43';ctx.lineWidth=4;ctx.fill(p);ctx.stroke(p);",`const rg=ctx.createLinearGradient(b.x-34,b.y-32,b.x+38,b.y+40);rg.addColorStop(0,rockStage===0?'#c0b5a2':rockStage===1?'#c9bca7':'#d0c2aa');rg.addColorStop(.42,rockStage===0?'#81786c':rockStage===1?'#908678':'#9f9382');rg.addColorStop(1,rockStage===0?'#4a443d':rockStage===1?'#575047':'#655c50');ctx.save();ctx.shadowColor='#24150d99';ctx.shadowBlur=7;ctx.shadowOffsetX=3;ctx.shadowOffsetY=5;ctx.fillStyle=rg;ctx.strokeStyle='#494039';ctx.lineWidth=4;ctx.fill(p);ctx.stroke(p);ctx.restore();ctx.save();ctx.globalAlpha=.30;ctx.fillStyle='#f7e8c9';ctx.beginPath();ctx.ellipse(b.x-12,b.y-14,15,6,-.35,0,7);ctx.fill();ctx.restore();`);

    const fxNeedle="canvas.addEventListener('pointerdown'";
    if(page.includes(fxNeedle)){
      const fxJs=\`let lastVisualFx=0;function spawnToolFx(x,y,kind){const now=performance.now();if(now-lastVisualFx<55)return;lastVisualFx=now;const amount=kind==='hammer'?5:3;for(let i=0;i<amount;i++){const e=document.createElement('i');e.className='dig-fx '+(kind==='hammer'?'rock-fx':'sand-fx');e.style.left=x+'px';e.style.top=y+'px';const a=-2.55+1.8*(i/Math.max(1,amount-1))+(Math.random()-.5)*.2;const dist=(kind==='hammer'?34:20)+Math.random()*(kind==='hammer'?25:16);e.style.setProperty('--dx',Math.cos(a)*dist+'px');e.style.setProperty('--dy',Math.sin(a)*dist+'px');e.style.setProperty('--rot',((Math.random()-.5)*220)+'deg');stage.appendChild(e);setTimeout(()=>e.remove(),600)}}function shineBone(b){if(!b)return;const g=document.createElement('div');g.className='bone-glow';g.style.left=(b.x/W*100)+'%';g.style.top=(b.y/H*100)+'%';stage.appendChild(g);setTimeout(()=>g.remove(),800)}\`;
      page=page.replace(fxNeedle,fxJs+fxNeedle);
      page=page.replace("function dig(x,y){\\n      unlockAudio();","function dig(x,y){\\n      unlockAudio();spawnToolFx(x,y,tool==='hammer'?'hammer':'brush');");
      page=page.replace('b.clean=100;updatePolishPanel(b);b.found=true;celebrateDiscovery();found()','b.clean=100;updatePolishPanel(b);b.found=true;shineBone(b);celebrateDiscovery();found()');
    }
    ${needle}`;

  src=src.replace(needle,patch);
  document.open();document.write(src);document.close();
}catch(e){
  document.querySelector('#loading').innerHTML='<div class="error"><b>読み込みに失敗しました</b><p>'+e.message+'</p></div>';
}
})();
</script>
</body>
</html>
