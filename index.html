<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あおの きょうりゅう はっくつたい gameplay v2.2</title>
<style>html,body{margin:0;min-height:100%;background:#bde4df;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.loading{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px;color:#573720}.error{color:#9b3326}</style>
</head>
<body>
<div class="loading" id="loading"><div><b>🦖 gameplay v2.2 を準備しています</b><p>ブラシを少し丁寧に使う調整をしています…</p></div></div>
<script>
(async()=>{
try{
 const url='https://raw.githubusercontent.com/soan4/ao-dinosaur-excavation-survey/c51c53d0ba0f4cda5b4f8fbcb4aa4dc8f1602a1d/index.html';
 const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('ゲーム本体を読み込めませんでした');
 let html=await res.text();
 html=html.replace('const cols=8,rows=6,cw2=10,ch2=10,brushR=22;','const cols=8,rows=6,cw2=10,ch2=10,brushR=13;');
 html=html.replace('gameplay v2.1','gameplay v2.2');
 if(!html.includes('brushR=13'))throw new Error('ブラシ速度の調整に失敗しました');
 document.open();document.write(html);document.close();
}catch(e){document.querySelector('#loading').innerHTML='<div class="error"><b>読み込みに失敗しました</b><p>'+e.message+'</p></div>'}
})();
</script>
</body>
</html>
