<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#3b2415"><title>あおの きょうりゅう はっくつたい art v4.5</title><style>
:root{--ink:#3d2819;--edge:#5a351b;--paper:#f8e7b9;--green:#77b934;--orange:#ee9828}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:#28180e;display:flex;justify-content:center;touch-action:manipulation}button{font:inherit;color:inherit}.app{width:min(100%,620px);min-height:100dvh;padding:max(8px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:linear-gradient(#654428,#432d1c 17%,#302117);box-shadow:0 0 36px #0008}.top{display:grid;grid-template-columns:1fr auto;gap:8px}.plate,.counter,.mission,.tool,.polishPanel,.navbtn,.card{border:3px solid var(--edge);background:linear-gradient(#fff4cf,#e7c67f);box-shadow:inset 0 2px #fff9,inset 0 -5px #aa713366,0 4px 0 #28160b88}.plate{border-radius:15px;padding:7px 10px;font-size:clamp(17px,5vw,25px);font-weight:1000;white-space:nowrap;overflow:hidden}.counter{border-radius:999px;padding:7px 12px;font-size:clamp(17px,5vw,23px);font-weight:1000}.mission{border-radius:13px;text-align:center;padding:7px 8px;font-weight:1000;font-size:13px}.game{position:relative;flex:1;min-height:500px;border:7px solid #543018;border-radius:26px;overflow:hidden;background:#8b582e;box-shadow:inset 0 0 0 3px #b7804677,inset 0 12px 20px #ffe2a819,0 8px 0 #241309,0 16px 25px #0008;touch-action:none}canvas{display:block;width:100%;height:100%}.tools{position:absolute;left:8px;top:10px;z-index:5;display:flex;gap:7px}.tool{min-width:82px;min-height:64px;border-radius:16px;font-weight:1000;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 7px}.tool .ico{font-size:28px}.tool.selected{background:linear-gradient(#58bdf4,#1677b7);color:#fff;border-color:#153b59;outline:3px solid #dff5ff;box-shadow:inset 0 3px #ade3ff,inset 0 -6px #0c4a7799,0 5px 0 #10293e}.modeLabel{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:4;padding:7px 14px;border-radius:999px;background:#3a2416df;color:#fff4d2;border:2px solid #9c7148;font-size:13px;font-weight:1000;white-space:nowrap}.message{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:7;max-width:90%;padding:7px 12px;border-radius:999px;background:#fff1cddd;border:2px solid #67401f;font-weight:1000;text-align:center;opacity:0;transition:.18s}.message.show{opacity:1}.polishPanel{display:none;border-radius:20px;padding:9px 10px 10px;background:linear-gradient(#fff3cf,#e6c780)}.polishMode+.polishPanel,.app.polishing .polishPanel{display:block}.polishHead{display:flex;align-items:center;gap:8px;font-weight:1000;font-size:15px;margin-bottom:8px}.polishHead .boneIcon{font-size:22px}.polishHead span:last-child{flex:1;text-align:center}.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:relative}.step{min-height:86px;display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:4px;padding:8px 6px;border:3px solid #b58c55;border-radius:15px;background:#f6e4b6;font-size:11px;font-weight:1000}.step .num{font-size:25px;line-height:1}.step .check{font-size:21px;opacity:.18}.step.done{background:#e2f4ae;border-color:#73ae38}.step.done .check{opacity:1}.step.active{background:#fff0ba;border-color:#ee922c;outline:3px solid #fff}.stepName{text-align:center;line-height:1.25}.progressRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-top:9px}.bar{height:21px;border:3px solid #513019;border-radius:999px;background:#2f2923;overflow:hidden;box-shadow:inset 0 2px 4px #0008}.fill{height:100%;width:0;background:linear-gradient(#d8f35e,#62aa27);transition:width .08s}.pct{font-weight:1000;font-size:32px;line-height:1}.almost{grid-column:1/-1;display:none;text-align:right;font-size:13px;font-weight:1000;color:#a34d1f}.almost.show{display:block}.bottomNav{display:grid;grid-template-columns:.8fr 2.2fr .9fr;gap:8px}.navbtn{min-height:66px;border-radius:16px;font-weight:1000;font-size:14px;padding:5px 7px}.navbtn .ico{display:block;font-size:25px}.navbtn.main{font-size:16px}.navbtn.hint{background:linear-gradient(#aee457,#60a92d);border-color:#315d1a;color:#18300d}.overlay{position:fixed;inset:0;background:#1d2e25e8;display:none;place-items:center;padding:14px;z-index:20}.overlay.open{display:grid}.card{width:min(100%,540px);border-width:6px;border-radius:27px;padding:15px;text-align:center}.card h2{margin:0;color:#a54a21;font-size:clamp(27px,8vw,40px)}.museum{position:relative;margin:10px 0;padding:8px;border:4px solid #6a4728;border-radius:17px;background:radial-gradient(circle at 50% 15%,#5b4a39,#29221b 75%);min-height:250px;overflow:hidden}.museum svg{width:100%;max-height:230px}.part{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.45) translateY(-20px);transition:.45s}.part.in{opacity:1;transform:none}.boneLine{fill:none;stroke:#d9c493;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.ribLine{fill:none;stroke:#cdb788;stroke-width:4;stroke-linecap:round}.boneFill{fill:#ead9a8;stroke:#6c5438;stroke-width:6}.again{border:4px solid #573019;border-radius:16px;background:linear-gradient(#ffc25d,#e47d29);padding:10px 20px;font-weight:1000;font-size:18px;box-shadow:0 5px 0 #32190c}.fx{position:absolute;z-index:9;pointer-events:none}.glow{width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:50%;background:radial-gradient(circle,#fffde5dd,#ffe87166 30%,transparent 70%);animation:shine .75s ease-out forwards}.sandfx{width:5px;height:4px;border-radius:50%;background:#d7a25d;animation:fly .45s forwards}.rockfx{width:8px;height:6px;border-radius:45%;background:#82796c;animation:fly .5s forwards}@keyframes fly{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.4)}}@keyframes shine{0%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1.5)}}@media(max-width:450px){.game{min-height:470px}.tool{min-width:74px;min-height:58px}.modeLabel{top:11px;font-size:12px}.step{min-height:78px;padding:6px 4px;font-size:10px}.step .num{font-size:21px}.step .check{font-size:18px}.pct{font-size:28px}.bottomNav{grid-template-columns:.8fr 2fr .85fr}.navbtn{min-height:60px}}
</style></head><body><main class="app" id="app"><div class="top"><div class="plate">🦖 きょうりゅう はっくつたい</div><div class="counter">🦴 <b id="count">0</b> / 8</div></div><div class="mission">こんかいの きょうりゅう：<b id="targetName"></b></div><section class="game" id="stage"><canvas id="dig"></canvas><div class="modeLabel" id="modeLabel">🔎 はっくつモード</div><div class="tools"><button class="tool selected" id="brush"><span class="ico">🖌️</span>ブラシ</button><button class="tool" id="hammer"><span class="ico">🔨</span>ハンマー</button></div><div class="message" id="message"></div></section><section class="polishPanel" id="polishPanel"><div class="polishHead"><span class="boneIcon">🦴</span><span id="polishTitle">ほねを きれいにしよう！</span></div><div class="steps"><div class="step" id="step1"><span class="num">1</span><span class="stepName">泥のかたまり</span><span class="check">✅</span></div><div class="step" id="step2"><span class="num">2</span><span class="stepName">うすい泥</span><span class="check">✅</span></div><div class="step" id="step3"><span class="num">3</span><span class="stepName">さいごの汚れ</span><span class="check">✅</span></div></div><div class="progressRow"><div class="bar"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div><div class="almost" id="almost">✨ あと少し！</div></div></section><nav class="bottomNav"><button class="navbtn" id="mapBtn"><span class="ico">🗺️</span>ちず</button><button class="navbtn main" id="wholeBtn"><span class="ico">🦖</span>ぜんたいを みる<br>(<b id="wholeCount">0</b> / 8)</button><button class="navbtn hint" id="hint"><span class="ico">💡</span>ヒント</button></nav></main><div class="overlay" id="complete"><div class="card"><h2>🎉 はっくつ せいこう！</h2><h3 id="resultName"></h3><p>8この ほねが そろったよ！</p><div class="museum"><svg id="skeleton" viewBox="0 0 560 300"></svg></div><div id="assemblyText"><b>ほねを くみたてるよ！</b></div><button class="again" id="again">つぎを はっくつする</button></div></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),app=$('#app'),canvas=$('#dig'),ctx=canvas.getContext('2d'),stage=$('#stage'),countEl=$('#count'),wholeCount=$('#wholeCount'),targetName=$('#targetName'),resultName=$('#resultName'),message=$('#message'),brushBtn=$('#brush'),hammerBtn=$('#hammer'),modeLabel=$('#modeLabel'),polishTitle=$('#polishTitle'),fill=$('#fill'),pct=$('#pct'),almost=$('#almost'),complete=$('#complete'),skeleton=$('#skeleton'),assemblyText=$('#assemblyText');const dinos=[{id:'trex',name:'ティラノサウルス'},{id:'triceratops',name:'トリケラトプス'},{id:'stegosaurus',name:'ステゴサウルス'}],names=['頭骨','下あご','背骨','肋骨','骨盤','前脚','後脚','尾'];let W=0,H=0,dpr=1,tool='brush',drag=false,bones=[],grains=[],dino=dinos[0],active=null,mode='search',msgTimer=0,audio=null,lastFx=0;
function circle(p,x,y,r){p.moveTo(x+r,y);p.arc(x,y,r,0,7)}const shapes=[p=>{p.moveTo(-38,-7);p.bezierCurveTo(-30,-30,7,-34,35,-17);p.lineTo(43,-4);p.lineTo(31,10);p.lineTo(5,18);p.lineTo(-28,20);p.lineTo(-41,5);p.closePath()},p=>{p.moveTo(-38,-5);p.quadraticCurveTo(-5,23,35,7);p.lineTo(40,0);p.quadraticCurveTo(5,15,-32,-14);p.closePath()},p=>{for(let i=0;i<7;i++){let x=-36+i*12;circle(p,x,0,6);p.rect(x-2,-15,4,9)}p.rect(-41,-3,82,6)},p=>{p.rect(-4,-27,8,54);for(let i=-2;i<=2;i++){let y=i*10;p.moveTo(-2,y);p.bezierCurveTo(-18,y+4,-30,y+13,-34,y+27);p.moveTo(2,y);p.bezierCurveTo(18,y+4,30,y+13,34,y+27)}},p=>{p.moveTo(-8,-12);p.bezierCurveTo(-28,-30,-42,-13,-34,8);p.bezierCurveTo(-26,24,-12,27,0,11);p.bezierCurveTo(12,27,26,24,34,8);p.bezierCurveTo(42,-13,28,-30,8,-12);p.closePath()},p=>{circle(p,-24,-18,8);p.moveTo(-19,-13);p.lineTo(1,5);p.lineTo(8,-2);p.lineTo(-13,-24);p.closePath();circle(p,4,7,7);p.moveTo(8,11);p.lineTo(32,25)},p=>{circle(p,-25,-20,9);p.moveTo(-19,-14);p.lineTo(4,4);p.lineTo(12,-6);p.lineTo(-14,-27);p.closePath();circle(p,6,6,8);p.moveTo(11,10);p.lineTo(28,35);p.lineTo(42,36)},p=>{for(let i=0;i<8;i++){let x=-39+i*11;circle(p,x,(i-3)*1.5,7-i*.5)}p.moveTo(37,-4);p.lineTo(53,1);p.lineTo(37,6);p.closePath()}];function path(b,scale=1){const p=new Path2D(),fn=shapes[b.shape];if(scale===1){fn(p);return p}const tmp=new Path2D();fn(tmp);p.addPath(tmp,new DOMMatrix().scale(scale));return p}
function resize(){let r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);reset()}function reset(){mode='search';active=null;app.classList.remove('polishing');dino=dinos[Math.floor(Math.random()*dinos.length)];targetName.textContent=dino.name;resultName.textContent=dino.name;countEl.textContent=0;wholeCount.textContent=0;complete.classList.remove('open');bones=[];grains=[];const mx=58,my=95,cw=(W-mx*2)/2,ch=(H-my-60)/4;for(let i=0;i<8;i++)bones.push({x:mx+cw*(i%2+.25+Math.random()*.48),y:my+ch*(Math.floor(i/2)+.22+Math.random()*.5),angle:(Math.random()-.5)*.8,shape:i,name:names[i],rockHP:i%2===0?100:0,found:false,discovered:false,clean:0,grid:Array(80).fill(false)});for(let i=0;i<220;i++)grains.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*4,a:.1+Math.random()*.24,dug:0});resetPanel();setSearchUi();draw();say('ブラシで砂をはらって 骨をみつけよう！')}
function ground(){let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#b77c43');g.addColorStop(.5,'#8d572f');g.addColorStop(1,'#59321c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<34;i++){let x=((i*157+31)%983)/983*W,y=((i*223+17)%977)/977*H,r=2.5+((i*31)%19)/3;ctx.fillStyle='#4b3425';ctx.beginPath();ctx.ellipse(x,y,r,r*.7,(i%6)*.3,0,7);ctx.fill()}}
function boneAt(b,x,y,s=1,rot=b.angle){ctx.save();ctx.translate(x,y);ctx.rotate(rot);const p=path(b,s),g=ctx.createLinearGradient(-55*s,-45*s,50*s,45*s);g.addColorStop(0,'#fff2ca');g.addColorStop(.4,'#ead59f');g.addColorStop(1,'#9b7c50');ctx.fillStyle=g;ctx.strokeStyle='#60482f';ctx.lineWidth=3.5*s;ctx.shadowColor='#2b170c88';ctx.shadowBlur=5*s;ctx.shadowOffsetY=4*s;ctx.fill(p);ctx.stroke(p);ctx.restore()}
function searchDraw(){ground();grains.forEach((g,i)=>{if(g.dug<1){ctx.globalAlpha=g.a*(1-g.dug);ctx.fillStyle=i%2?'#6f4126':'#c48748';ctx.beginPath();ctx.ellipse(g.x,g.y,g.r*1.3,g.r*.72,0,0,7);ctx.fill()}});ctx.globalAlpha=1;bones.forEach(b=>{if(b.found)return;if(b.discovered)boneAt(b,b.x,b.y,1,b.angle);if(b.rockHP>0){ctx.fillStyle='#777067';ctx.strokeStyle='#453f38';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(b.x,b.y,38,31,b.angle*.2,0,7);ctx.fill();ctx.stroke();if(b.rockHP<75){ctx.strokeStyle='#ead8b4';ctx.beginPath();ctx.moveTo(b.x-18,b.y-18);ctx.lineTo(b.x,b.y);ctx.lineTo(b.x-12,b.y+18);ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+20,b.y+12);ctx.stroke()}}})}
function polishDraw(){ground();if(!active)return;const cx=W*.5,cy=H*.56,s=Math.min(W,H)/145;boneAt(active,cx,cy,s,0);ctx.save();ctx.translate(cx,cy);const p=path(active,s);ctx.clip(p);for(let gy=0;gy<8;gy++)for(let gx=0;gx<10;gx++){let i=gy*10+gx;if(active.grid[i])continue;let x=(-50+gx*10)*s,y=(-40+gy*10)*s;if(active.clean<35){ctx.globalAlpha=.94;ctx.fillStyle=(gx+gy)%2?'#8d512b':'#a56534';ctx.fillRect(x,y,11*s,11*s)}else if(active.clean<75){ctx.globalAlpha=.7;ctx.fillStyle=(gx+gy)%2?'#be8954':'#c89b68';ctx.beginPath();ctx.ellipse(x+5*s,y+5*s,5*s,4*s,0,0,7);ctx.fill()}else{ctx.globalAlpha=.52;ctx.fillStyle='#9d764f';ctx.beginPath();ctx.arc(x+4*s,y+4*s,2*s,0,7);ctx.fill()}}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);mode==='search'?searchDraw():polishDraw()}
function say(t){message.textContent=t;message.classList.add('show');clearTimeout(msgTimer);msgTimer=setTimeout(()=>message.classList.remove('show'),1200)}function tone(f=300,d=.04,v=.018){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d+.01)}catch(e){}}
function resetPanel(){fill.style.width='0%';pct.textContent='0%';almost.classList.remove('show');[1,2,3].forEach(i=>$('#step'+i).className='step')}function updatePanel(){let n=Math.round(active.clean);fill.style.width=n+'%';pct.textContent=n+'%';almost.classList.toggle('show',n>=80&&n<100);const band=n<35?1:n<75?2:3;[1,2,3].forEach(i=>{let e=$('#step'+i);e.className='step '+(i<band?'done':i===band?'active':'')})}
function setSearchUi(){app.classList.remove('polishing');modeLabel.textContent='🔎 はっくつモード';brushBtn.style.display='flex';hammerBtn.style.display='flex'}function enterPolish(b){active=b;mode='polish';tool='brush';app.classList.add('polishing');modeLabel.textContent='✨ みがきモード';polishTitle.textContent='🦴 '+dino.name+'の'+b.name+'を きれいにしよう！';brushBtn.style.display='flex';hammerBtn.style.display='none';brushBtn.classList.add('selected');hammerBtn.classList.remove('selected');resetPanel();draw();say('ブラシで ゆっくり なぞろう！')}
function finishPolish(){active.found=true;active.clean=100;let n=bones.filter(b=>b.found).length;countEl.textContent=n;wholeCount.textContent=n;tone(780,.14,.04);say('✨ '+active.name+' はっけん！ '+n+' / 8');setTimeout(()=>{if(n===8){complete.classList.add('open');assemble()}else{mode='search';active=null;setSearchUi();resetPanel();draw();say('つぎの骨を さがそう！')}},700)}
function searchAction(x,y){grains.forEach(g=>{let d=Math.hypot(g.x-x,g.y-y);if(d<(tool==='brush'?27:18))g.dug=Math.min(1,g.dug+(tool==='brush'?.35:.07))});for(let b of bones){if(b.found||Math.hypot(b.x-x,b.y-y)>58)continue;if(b.rockHP>0){if(tool==='hammer'){let before=b.rockHP;b.rockHP=Math.max(0,b.rockHP-25);tone(95,.06,.035);if(before>75&&b.rockHP<=75)say('⚡ ヒビが はいった！');else if(before>40&&b.rockHP<=40)say('🔨 おおきな ヒビ！');else if(b.rockHP===0){b.discovered=true;say('💥 骨が みえた！ ブラシでさわってみよう')}}else say('🪨 かたい岩は ハンマー！');draw();return}if(tool==='brush'){b.discovered=true;draw();setTimeout(()=>enterPolish(b),180);return}else say('🦴 骨はブラシで やさしく！')}draw()}
function polishAction(x,y){if(!active)return;const cx=W*.5,cy=H*.56,s=Math.min(W,H)/145,lx=(x-cx)/s,ly=(y-cy)/s;let changed=false;for(let gy=0;gy<8;gy++)for(let gx=0;gx<10;gx++){let i=gy*10+gx,px=-45+gx*10,py=-35+gy*10;if(!active.grid[i]&&Math.hypot(px-lx,py-ly)<8){active.grid[i]=true;changed=true}}let cleared=active.grid.reduce((a,v)=>a+(v?1:0),0);active.clean=Math.min(100,cleared/58*100);if(changed)tone(320+Math.min(150,active.clean),.025,.012);updatePanel();draw();if(active.clean>=92)finishPolish()}
function choose(t){tool=t;brushBtn.classList.toggle('selected',t==='brush');hammerBtn.classList.toggle('selected',t==='hammer');say(t==='brush'?'🖌️ ブラシで ゆっくり なぞろう！':'🔨 岩を ハンマーで たたこう！')}function pt(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}canvas.addEventListener('pointerdown',e=>{drag=true;canvas.setPointerCapture(e.pointerId);let p=pt(e);mode==='search'?searchAction(p.x,p.y):polishAction(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!drag||tool!=='brush')return;let p=pt(e);mode==='search'?searchAction(p.x,p.y):polishAction(p.x,p.y)});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);brushBtn.onclick=()=>choose('brush');hammerBtn.onclick=()=>choose('hammer');$('#hint').onclick=()=>{if(mode==='polish'){say('💡 骨の茶色いところを ブラシでなぞろう！');return}let b=bones.find(x=>!x.found);if(!b)return;choose(b.rockHP>0?'hammer':'brush');say('💡 '+b.name+'は このあたり！')};$('#mapBtn').onclick=()=>say('🗺️ ちずは これから追加するよ！');$('#wholeBtn').onclick=()=>say('🦖 いま '+bones.filter(b=>b.found).length+' / 8 この骨がそろっているよ！');
function skeletonMarkup(){return `<g class="part"><path class="boneLine" d="M435 90C350 98 290 122 220 154S92 178 25 166"/></g><g class="part"><path class="ribLine" d="M355 112q-8 70-48 88M332 120q-8 62-44 80M308 129q-7 52-38 70"/></g><g class="part"><path class="boneFill" d="M285 132q45-30 91-8 18 29-5 54-48 25-91-5z"/></g><g class="part"><path class="boneLine" d="M302 180l-30 68 7 35M350 180l38 64-3 39M279 283h-40M385 283h43"/></g><g class="part"><path class="boneFill" d="M427 54q52-26 103 7l16 27-27 21-75 1-30-21z"/></g><g class="part"><path class="boneLine" d="M445 92l87 0M466 92l9 16M489 92l8 15"/></g><g class="part"><path class="boneLine" d="M368 149l28 29 35 1M358 158l18 35 34 8"/></g><g class="part"><path class="boneLine" d="M428 95C365 105 320 122 278 141"/></g>`}function assemble(){skeleton.innerHTML=skeletonMarkup();let parts=[...skeleton.querySelectorAll('.part')];assemblyText.textContent='ほねを くみたてるよ！';parts.forEach((p,i)=>setTimeout(()=>{p.classList.add('in');assemblyText.textContent=names[i]+'を セット！';tone(430+i*45,.08,.025)},180+i*170));setTimeout(()=>{assemblyText.textContent='✨ '+dino.name+'の ぜんしんこっかく かんせい！';tone(880,.18,.05)},180+parts.length*170+180)}$('#again').onclick=reset;window.addEventListener('resize',resize);requestAnimationFrame(resize)})();
</script></body></html>
