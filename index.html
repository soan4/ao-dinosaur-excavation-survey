x.globalAlpha=.25+b.clean/135;ctx.fillStyle='#f4e4b5';ctx.strokeStyle='#695139';ctx.lineWidth=4;const p=pathFor(b);ctx.fill(p);ctx.stroke(p);if(!b.found){ctx.globalAlpha=Math.max(0,.95-b.clean/100);ctx.fillStyle='#b77b3e';ctx.fillRect(-39,-28,78,56)}ctx.restore()}";const neu="if(b.clean>0){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);ctx.globalAlpha=.25+b.clean/135;const img=trexDigBoneImages[b.shape];if(dino&&dino.id==='trex'&&img&&img.complete&&img.naturalWidth){ctx.drawImage(img,-42,-42,84,84)}else{ctx.fillStyle='#f4e4b5';ctx.strokeStyle='#695139';ctx.lineWidth=4;const p=pathFor(b);ctx.fill(p);ctx.stroke(p)}if(!b.found){ctx.globalAlpha=Math.max(0,.95-b.clean/100);ctx.fillStyle='#b77b3e';ctx.fillRect(-39,-28,78,56)}ctx.restore()}";html=html.replace(old,neu);document.open();document.write(html);document.close()}catch(e){document.querySelector('#loading').innerHTML='<div class="error"><b>読み込みに失敗しました</b><p>'+e.message+'</p><p>ページを再読み込みしてください。</p></div>'}})();</script></body></html>
