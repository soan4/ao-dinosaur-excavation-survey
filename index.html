function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);reset()}function reset(){assemblyTimers.forEach(clearTimeout);assemblyTimers=[];document.querySelectorAll('.partTag').forEach(e=>e.remove());dino=dinos[Math.floor(Math.random()*dinos.length)];targetName.textContent=dino.name;resultName.textContent=dino.name;bones=[];grains=[];countEl.textContent=0;complete.classList.remove('open');resetPanel();const mx=62,my=105,cw=(W-mx*2)/2,ch=(H-my-62)/4;for(let i=0;i<8;i++){const rock=i%2===0;bones.push({x:mx+cw*(i%2+.27+Math.random()*.43),y:my+ch*(Math.floor(i/2)+.25+Math.random()*.44),angle:(Math.random()-.5)*.9,shape:i,name:partNames[i],rockHP:rock?100:0,clean:0,grid:Array(48).fill(false),found:false})}for(let i=0;i<230;i++)grains.push({x:Math.random()*W,y:Math.random()*H,r:.8+Math.random()*4,a:.08+Math.random()*.25,dug:0});draw();say('ブラシで砂をはらって 骨をみつけよう！')}
function ground(){let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#b77c43');g.addColorStop(.45,'#8e582f');g.addColorStop(1,'#5c351e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<30;i++){const x=((i*157+31)%983)/983*W,y=((i*223+17)%977)/977*H,r=2.5+((i*31)%19)/3;ctx.fillStyle='#4b3425';ctx.beginPath();ctx.ellipse(x,y,r,r*.7,(i%6)*.3,0,7);ctx.fill()}}function boneDraw(b){if(b.clean<=0)return;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);ctx.globalAlpha=.4+b.clean/150;const p=pathFor(b),g=ctx.createLinearGradient(-40,-32,40,35);g.addColorStop(0,'#fff2ca');g.addColorStop(.4,'#ead59f');g.addColorStop(1,'#9b7c50');ctx.fillStyle=g;ctx.strokeStyle='#60482f';ctx.lineWidth=3.5;ctx.fill(p);ctx.stroke(p);if(!b.found){ctx.save();ctx.clip(p);for(let gy=0;gy<6;gy++)for(let gx=0;gx<8;gx++){const i=gy*8+gx;if(b.grid[i])continue;let x=-40+gx*10,y=-30+gy*10;ctx.fillStyle=b.clean<35?'#92552d':b.clean<75?'#b77b49':'#9d764f';ctx.globalAlpha=b.clean<35?.95:b.clean<75?.7:.5;ctx.fillRect(x,y,b.clean<75?11:4,b.clean<75?11:4)}}ctx.restore()}ctx.restore()}function rockDraw(b){if(b.rockHP<=0)return;const p=rockPath(b),s=b.rockHP>70?0:b.rockHP>35?1:2,g=ctx.createLinearGradient(b.x-35,b.y-34,b.x+38,b.y+40);g.addColorStop(0,'#c0b6a3');g.addColorStop(1,'#524c44');ctx.fillStyle=g;ctx.strokeStyle='#464139';ctx.lineWidth=4;ctx.fill(p);ctx.stroke(p);if(s){ctx.strokeStyle='#ead8b4';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(b.x-20,b.y-21);ctx.lineTo(b.x-4,b.y-5);ctx.lineTo(b.x-14,b.y+17);ctx.moveTo(b.x-4,b.y-5);ctx.lineTo(b.x+20,b.y+12);if(s>1){ctx.moveTo(b.x+15,b.y-23);ctx.lineTo(b.x+5,b.y-6);ctx.lineTo(b.x+17,b.y+20)}ctx.stroke()}}function draw(){ground();grains.forEach((g,i)=>{if(g.dug<1){ctx.globalAlpha=g.a*(1-g.dug);ctx.fillStyle=i%2?'#6f4126':'#c48748';ctx.beginPath();ctx.ellipse(g.x,g.y,g.r*1.3,g.r*.72,0,0,7);ctx.fill()}});ctx.globalAlpha=1;bones.forEach(b=>{boneDraw(b);rockDraw(b)})}
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function say(t){status.textContent=t;message.textContent=t;message.classList.add('show');clearTimeout(msgTimer);msgTimer=setTimeout(()=>message.classList.remove('show'),1200)}function resetPanel(){fill.style.width='0%';pct.textContent='0%';stageLabel.textContent='骨を みつけよう！';almost.classList.remove('show')}function updatePanel(b){if(!b||b.rockHP>0||b.found)return;let n=Math.round(b.clean);fill.style.width=n+'%';pct.textContent=n+'%';stageLabel.textContent=b.name+'：'+(n<35?'濃い泥':n<75?'薄い泥':'細かな汚れ');almost.classList.toggle('show',n>=80&&n<100)}function tone(f=300,d=.04,v=.018){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d+.01)}catch(e){}}function fx(x,y,kind){let now=performance.now();if(now-lastFx<45)return;lastFx=now;let n=kind==='hammer'?5:3;for(let i=0;i<n;i++){let e=document.createElement('i');e.className='fx '+(kind==='hammer'?'rockfx':'sandfx');e.style.left=x+'px';e.style.top=y+'px';let a=-2.55+1.8*i/Math.max(1,n-1),d=20+Math.random()*25;e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d+'px');e.style.setProperty('--rot',((Math.random()-.5)*220)+'deg');stage.appendChild(e);setTimeout(()=>e.remove(),600)}}function shine(b){let e=document.createElement('div');e.className='glow';e.style.left=b.x+'px';e.style.top=b.y+'px';stage.appendChild(e);setTimeout(()=>e.remove(),800)}function tag(b){let e=document.createElement('div');e.className='partTag';e.textContent='🦴 '+b.name;e.style.left=b.x+'px';e.style.top=b.y-45+'px';stage.appendChild(e)}

function assembleMuseum(){skeleton.innerHTML=skeletonMarkup(dino.id);assemblyText.textContent='ほねを くみたてるよ！';museum.classList.remove('flash');const parts=[...skeleton.querySelectorAll('.part')].sort((a,b)=>+a.dataset.i-+b.dataset.i);parts.forEach((p,i)=>assemblyTimers.push(setTimeout(()=>{p.classList.add('in');assemblyText.textContent=partNames[i]+'を セット！';tone(430+i*45,.08,.025)},180+i*185)));assemblyTimers.push(setTimeout(()=>{assemblyText.textContent='✨ '+dino.name+'の ぜんしんこっかく かんせい！';museum.classList.add('flash');tone(880,.18,.05);if(navigator.vibrate)navigator.vibrate([30,30,45])},180+parts.length*185+180))}
function found(b){b.found=true;b.clean=100;shine(b);tag(b);let n=bones.filter(x=>x.found).length;countEl.textContent=n;say('✨ '+dino.name+'の'+b.name+' はっけん！ '+n+' / 8');tone(760,.12,.04);if(n===8)setTimeout(()=>{complete.classList.add('open');assembleMuseum()},650);else setTimeout(resetPanel,500)}function dig(x,y){fx(x,y,tool);let touched=false,wrong='';grains.forEach(g=>{let d=Math.hypot(g.x-x,g.y-y);if(d<(tool==='brush'?24:18))g.dug=Math.min(1,g.dug+(tool==='brush'?.3:.08))});for(const b of bones){if(b.found||Math.hypot(b.x-x,b.y-y)>62)continue;touched=true;if(b.rockHP>0){if(tool==='hammer'){let before=b.rockHP;b.rockHP=Math.max(0,b.rockHP-22);tone(95,.06,.035);if(before>70&&b.rockHP<=70)say('⚡ ヒビが はいった！');else if(before>35&&b.rockHP<=35)say('🔨 おおきな ヒビ！');else if(b.rockHP===0)say('💥 パカッ！ '+b.name+'をブラシで！')}else wrong='🪨 かたい岩は ハンマー！';break}if(tool==='hammer'){wrong='🦴 '+b.name+'はブラシで やさしく！';break}b.clean=Math.max(b.clean,8);let ca=Math.cos(-b.angle),sa=Math.sin(-b.angle),dx=x-b.x,dy=y-b.y,lx=dx*ca-dy*sa,ly=dx*sa+dy*ca,changed=false;for(let gy=0;gy<6;gy++)for(let gx=0;gx<8;gx++){let i=gy*8+gx,cx=-35+gx*10,cy=-25+gy*10;if(!b.grid[i]&&Math.hypot(cx-lx,cy-ly)<8){b.grid[i]=true;changed=true}}let cleared=b.grid.reduce((s,v)=>s+(v?1:0),0);b.clean=Math.min(100,cleared/36*100);updatePanel(b);if(changed)tone(310+Math.min(150,b.clean),.025,.012);if(b.clean>=92)found(b);break}if(wrong)say(wrong);draw()}function choose(t){tool=t;brushBtn.classList.toggle('selected',t==='brush');hammerBtn.classList.toggle('selected',t==='hammer');say(t==='brush'?'🖌️ ブラシで ゆっくり なぞろう！':'🔨 岩を たたいて ヒビをいれよう！')}canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId);let p=point(e);dig(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!dragging||tool!=='brush')return;let p=point(e);dig(p.x,p.y)});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);brushBtn.onclick=()=>choose('brush');hammerBtn.onclick=()=>choose('hammer');$('#hint').onclick=()=>{let b=bones.find(x=>!x.found);if(!b)return;choose(b.rockHP>0?'hammer':'brush');say('💡 '+b.name+'は このあたり！');shine(b)};$('#again').onclick=reset;window.addEventListener('resize',resize);requestAnimationFrame(resize)})();
