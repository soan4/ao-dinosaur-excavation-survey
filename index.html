<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3b2415">
<title>あおの きょうりゅう はっくつたい art v4</title>
<style>
:root{--ink:#3d2819;--edge:#5a351b;--paper:#f6e5b7;--paper2:#fff5d3;--blue:#177bbb;--green:#70b437;--orange:#efa12d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 0,#76502e,#3d2818 54%,#21150d);display:flex;justify-content:center;touch-action:manipulation}
button{font:inherit;color:inherit}
.app{width:min(100%,620px);min-height:100dvh;padding:max(8px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#624225 0,#432c1b 15%,#302117 100%);box-shadow:0 0 36px #0008}
.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.titleplate,.counter,.mission,.statusbar,.polish,.tool,.complete-card{border:3px solid var(--edge);background:linear-gradient(#fff4cf,#e7c67f);box-shadow:inset 0 2px #fff9,inset 0 -5px #aa713366,0 4px 0 #28160b88,0 8px 14px #0003}
.titleplate{border-radius:15px;padding:7px 10px;font-size:clamp(17px,5vw,25px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{border-radius:999px;padding:7px 12px;font-size:clamp(17px,5vw,23px);font-weight:1000;white-space:nowrap}
.mission{border-radius:13px;text-align:center;padding:6px 8px;font-weight:1000;font-size:13px}
.statusbar{border-radius:999px;background:linear-gradient(#86572c,#623a1d);color:#fff8df;border-color:#3c210f;padding:7px 12px;text-align:center;font-weight:1000;text-shadow:0 2px #2c170c;box-shadow:inset 0 2px #b9884c88,inset 0 -4px #321a0d88,0 4px 0 #1e100988}
.gamearea{position:relative;flex:1;min-height:530px;border:7px solid #543018;border-radius:26px;overflow:hidden;background:#8b582e;box-shadow:inset 0 0 0 3px #b7804677,inset 0 12px 20px #ffe2a819,0 8px 0 #241309,0 16px 25px #0008;touch-action:none}
canvas{display:block;width:100%;height:100%}
.gamearea:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,#fff4cc12,transparent 35%),radial-gradient(ellipse at 50% 110%,#20100866,transparent 66%);z-index:1}
.tools{position:absolute;left:8px;top:10px;z-index:4;display:flex;gap:7px}
.tool{min-width:86px;min-height:68px;border-radius:16px;font-weight:1000;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 7px;position:relative;overflow:hidden}
.tool:before{content:"";position:absolute;left:5px;right:5px;top:4px;height:35%;border-radius:11px;background:linear-gradient(#fff9,#fff0);pointer-events:none}
.tool .ico{font-size:28px;line-height:1.1}.tool.selected{background:linear-gradient(#58bdf4,#1677b7);color:#fff;border-color:#153b59;outline:3px solid #dff5ff;box-shadow:inset 0 3px #ade3ff,inset 0 -6px #0c4a7799,0 5px 0 #10293e,0 9px 14px #0005;text-shadow:0 2px #174763}.tool:active{transform:translateY(3px)}
.polish{position:absolute;right:8px;top:10px;z-index:4;width:158px;border-radius:15px;padding:8px;background:linear-gradient(#fff6da,#e4c486)}
.polish h3{margin:0 0 5px;text-align:center;font-size:15px}.stageLabel{font-size:11px;font-weight:1000;line-height:1.3;min-height:28px}.bar{height:17px;border:2px solid #513019;border-radius:999px;background:#2f2923;overflow:hidden;box-shadow:inset 0 2px 4px #0009}.fill{height:100%;width:0;background:linear-gradient(#d3f35b,#64a927);box-shadow:inset 0 2px #eeff9c;transition:width .08s}.pct{text-align:right;font-weight:1000;font-size:22px;line-height:1}.almost{display:none;margin-top:4px;text-align:center;font-size:12px;font-weight:1000;color:#9b431d}.almost.show{display:block}
.message{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;width:max-content;max-width:90%;padding:7px 12px;border-radius:999px;background:#fff1cddd;border:2px solid #67401f;font-weight:1000;text-align:center;opacity:0;transition:.18s;box-shadow:0 3px #3c210f66}.message.show{opacity:1;transform:translate(-50%,-2px)}
.hintbtn{position:absolute;right:10px;bottom:12px;z-index:5;width:78px;height:64px;border:3px solid #315d1a;border-radius:15px;background:linear-gradient(#aee457,#60a92d);box-shadow:inset 0 3px #e0ff9f,inset 0 -5px #3c772099,0 5px 0 #234111;color:#18300d;font-weight:1000}.hintbtn span{display:block;font-size:24px}
.legend{position:absolute;left:10px;bottom:12px;z-index:4;background:#fff0cddd;border:2px solid #66401f;border-radius:12px;padding:6px 8px;font-size:11px;font-weight:1000;box-shadow:0 3px #3b210f66}
.overlay{position:fixed;inset:0;background:#1d2e25e8;display:none;place-items:center;padding:14px;z-index:20}.overlay.open{display:grid}.complete-card{width:min(100%,520px);border-width:6px;border-radius:27px;padding:15px;text-align:center;background:linear-gradient(#fff6d5,#e3c17b);box-shadow:inset 0 4px #fff9,inset 0 -8px #99612777,0 12px 0 #2a160b99,0 22px 38px #000a}.complete-card h2{margin:0;color:#a54a21;font-size:clamp(28px,8vw,42px)}.museum{margin:10px 0;padding:14px;border:4px solid #6a4728;border-radius:17px;background:radial-gradient(circle at 50% 20%,#5b4a39,#29221b 75%);color:#fff2c9;min-height:190px;display:grid;place-items:center}.museumBone{font-size:72px;filter:drop-shadow(0 5px 4px #0008)}.again{border:4px solid #573019;border-radius:16px;background:linear-gradient(#ffc25d,#e47d29);padding:10px 20px;font-weight:1000;font-size:18px;box-shadow:inset 0 3px #ffe8ab,inset 0 -5px #b45a2299,0 5px 0 #32190c}
.fx{position:absolute;z-index:6;pointer-events:none;will-change:transform,opacity}.sandfx{width:5px;height:4px;border-radius:50%;background:#d7a25d;box-shadow:0 1px #654022;animation:sandFly .45s ease-out forwards}.rockfx{width:8px;height:6px;border-radius:45%;background:linear-gradient(135deg,#b8ad98,#5e574d);box-shadow:0 2px #2b2017aa;animation:rockFly .5s ease-out forwards}.glow{position:absolute;z-index:6;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fffde5dd 0 10%,#ffe87199 25%,#ffc92e33 50%,transparent 72%);filter:drop-shadow(0 0 10px #fff0a2);animation:shine .75s ease-out forwards}.glow:before,.glow:after{content:'✨';position:absolute;font-size:23px}.glow:before{left:0;top:3px}.glow:after{right:0;bottom:4px}
@keyframes sandFly{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.35)}}@keyframes rockFly{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.55)}}@keyframes shine{0%{opacity:0;transform:scale(.25)}30%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1.5)}}
@media(max-width:450px){.gamearea{min-height:500px}.polish{top:86px;right:7px;width:136px}.tools{top:9px}.tool{min-width:78px;min-height:62px}.legend{display:none}.hintbtn{width:68px;height:58px}.statusbar{font-size:13px}.stageLabel{font-size:10px}}
@media(max-height:700px){.gamearea{min-height:410px}.polish{width:132px}.tool{min-height:58px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <div class="topbar"><div class="titleplate">🦖 きょうりゅう はっくつたい</div><div class="counter">🦴 <b id="count">0</b> / 8</div></div>
  <div class="mission">こんかいの きょうりゅう：<b id="targetName">ティラノサウルス</b></div>
  <div class="statusbar" id="statusbar">ブラシで砂をはらって 骨をみつけよう！</div>
  <section class="gamearea" id="stage" aria-label="恐竜の化石を発掘する場所">
    <canvas id="dig"></canvas>
    <div class="tools"><button class="tool selected" id="brush"><span class="ico">🖌️</span>ブラシ</button><button class="tool" id="hammer"><span class="ico">🔨</span>ハンマー</button></div>
    <aside class="polish"><h3>✨ みがきちゅう！</h3><div class="stageLabel" id="stageLabel">骨を みつけよう！</div><div class="bar"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div><div class="almost" id="almost">✨ あと少し！</div></aside>
    <div class="message" id="message"></div>
    <div class="legend">🪨 岩はハンマー　🦴 骨はブラシ</div>
    <button class="hintbtn" id="hint"><span>💡</span>ヒント</button>
  </section>
</main>
<div class="overlay" id="complete"><div class="complete-card"><h2>🎉 はっくつ せいこう！</h2><h3 id="resultName">ティラノサウルス</h3><p>8この ほねが そろったよ！</p><div class="museum"><div><div class="museumBone">🦴</div><b id="museumText">ティラノサウルス・はくぶつかん展示</b></div></div><button class="again" id="again">つぎを はっくつする</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#dig'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage');
const countEl=document.querySelector('#count'),targetName=document.querySelector('#targetName'),resultName=document.querySelector('#resultName'),message=document.querySelector('#message'),statusbar=document.querySelector('#statusbar');
const fill=document.querySelector('#fill'),pct=document.querySelector('#pct'),stageLabel=document.querySelector('#stageLabel'),almost=document.querySelector('#almost'),complete=document.querySelector('#complete');
const brushBtn=document.querySelector('#brush'),hammerBtn=document.querySelector('#hammer');
const dinos=['ティラノサウルス','トリケラトプス','ステゴサウルス'];
let W=0,H=0,dpr=1,tool='brush',dragging=false,bones=[],grains=[],dino='',msgTimer=0,audio=null,lastFx=0;
const shapes=[
 p=>{p.ellipse(0,0,25,17,0,0,7);p.moveTo(15,-10);p.lineTo(35,-17);p.lineTo(29,1);p.lineTo(17,9)},
 p=>{p.moveTo(-29,0);p.lineTo(29,0);[-21,-7,7,21].forEach(x=>{p.moveTo(x,-10);p.lineTo(x,10)})},
 p=>{p.moveTo(-28,-15);p.quadraticCurveTo(0,25,28,-15);p.moveTo(-15,-1);p.lineTo(15,-1)},
 p=>{p.moveTo(-31,0);p.lineTo(31,0);p.moveTo(-28,-9);p.lineTo(-28,9);p.moveTo(28,-9);p.lineTo(28,9)},
 p=>{p.ellipse(-13,0,15,20,0,0,7);p.ellipse(13,0,15,20,0,0,7)},
 p=>{p.moveTo(-25,-17);p.lineTo(0,0);p.lineTo(-23,20);p.moveTo(0,0);p.lineTo(28,15)},
 p=>{p.moveTo(-29,-10);p.quadraticCurveTo(0,14,30,5);p.moveTo(-8,3);p.lineTo(-15,19)},
 p=>{p.moveTo(-30,9);p.quadraticCurveTo(0,-21,30,5);p.moveTo(19,0);p.lineTo(34,-11)}
];
function pathFor(b){const p=new Path2D();shapes[b.shape](p);return p}
function rockPath(b){const p=new Path2D();const r=36;p.moveTo(b.x-r,b.y-8);p.lineTo(b.x-23,b.y-31);p.lineTo(b.x+8,b.y-37);p.lineTo(b.x+34,b.y-17);p.lineTo(b.x+31,b.y+20);p.lineTo(b.x+5,b.y+36);p.lineTo(b.x-28,b.y+23);p.closePath();return p}
function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);reset()}
function reset(){dino=dinos[Math.floor(Math.random()*dinos.length)];targetName.textContent=dino;resultName.textContent=dino;document.querySelector('#museumText').textContent=dino+'・はくぶつかん展示';bones=[];grains=[];countEl.textContent=0;complete.classList.remove('open');resetPanel();const mx=58,my=100,cw=(W-mx*2)/2,ch=(H-my-60)/4;for(let i=0;i<8;i++){const rock=i%2===0;bones.push({x:mx+cw*(i%2+.28+Math.random()*.44),y:my+ch*(Math.floor(i/2)+.25+Math.random()*.45),angle:(Math.random()-.5)*1.15,shape:i,rockHP:rock?100:0,clean:0,grid:Array(48).fill(false),found:false})}for(let i=0;i<230;i++)grains.push({x:Math.random()*W,y:Math.random()*H,r:.8+Math.random()*4,a:.08+Math.random()*.25,dug:0});draw();say('ブラシで砂をはらって 骨をみつけよう！')}
function drawGround(){const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#b77c43');bg.addColorStop(.45,'#8e582f');bg.addColorStop(1,'#5c351e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);const light=ctx.createRadialGradient(W*.2,H*.12,5,W*.2,H*.12,Math.max(W,H)*.78);light.addColorStop(0,'#f2cd8540');light.addColorStop(.52,'#bc7f4015');light.addColorStop(1,'#2f170e22');ctx.fillStyle=light;ctx.fillRect(0,0,W,H);for(let i=0;i<30;i++){const x=((i*157+31)%983)/983*W,y=((i*223+17)%977)/977*H,r=2.5+((i*31)%19)/3;ctx.fillStyle='#2d1b1255';ctx.beginPath();ctx.ellipse(x+2,y+3,r*1.2,r*.75,(i%6)*.3,0,7);ctx.fill();const g=ctx.createLinearGradient(x-r,y-r,x+r,y+r);g.addColorStop(0,i%2?'#b29a78':'#9b8468');g.addColorStop(.45,i%2?'#7c6550':'#70604c');g.addColorStop(1,'#473528');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,r,r*.7,(i%6)*.3,0,7);ctx.fill();ctx.globalAlpha=.28;ctx.fillStyle='#f0ddbf';ctx.beginPath();ctx.ellipse(x-r*.25,y-r*.23,r*.25,r*.12,(i%6)*.3,0,7);ctx.fill();ctx.globalAlpha=1}}
function drawBone(b){if(b.clean<=0)return;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);ctx.globalAlpha=.38+b.clean/150;const p=pathFor(b);const g=ctx.createLinearGradient(-38,-30,35,35);g.addColorStop(0,'#fff1c9');g.addColorStop(.38,'#ead59f');g.addColorStop(.74,'#c8ad73');g.addColorStop(1,'#8d7047');ctx.shadowColor='#2d1b1266';ctx.shadowBlur=5;ctx.shadowOffsetX=2;ctx.shadowOffsetY=4;ctx.fillStyle=g;ctx.strokeStyle='#60482f';ctx.lineWidth=4;ctx.fill(p);ctx.stroke(p);ctx.shadowColor='transparent';ctx.save();ctx.clip(p);ctx.globalAlpha=.24;ctx.fillStyle='#fff9df';ctx.beginPath();ctx.ellipse(-11,-13,24,7,-.35,0,7);ctx.fill();if(!b.found){for(let gy=0;gy<6;gy++)for(let gx=0;gx<8;gx++){const idx=gy*8+gx;if(b.grid[idx])continue;const px=-40+gx*10,py=-30+gy*10;if(b.clean<35){ctx.globalAlpha=.95;ctx.fillStyle=(gx+gy)%3?'#a46331':'#884f29';ctx.fillRect(px-1,py-1,12,12)}else if(b.clean<75){ctx.globalAlpha=.72;ctx.fillStyle=(gx+gy)%2?'#c08c58':'#b97c47';ctx.beginPath();ctx.ellipse(px+5,py+5,5,4,0,0,7);ctx.fill()}else{ctx.globalAlpha=.52;ctx.fillStyle='#9d764f';ctx.beginPath();ctx.arc(px+4,py+4,1.7+(idx%3)*.45,0,7);ctx.fill()}}}ctx.restore();ctx.restore()}
function drawRock(b){if(b.rockHP<=0)return;const p=rockPath(b),s=b.rockHP>70?0:b.rockHP>35?1:2;const g=ctx.createLinearGradient(b.x-35,b.y-34,b.x+38,b.y+40);g.addColorStop(0,s===0?'#c0b6a3':s===1?'#c8bda8':'#d1c3aa');g.addColorStop(.43,s===0?'#81796c':s===1?'#918779':'#9f9583');g.addColorStop(1,s===0?'#4b4740':s===1?'#58534c':'#675f55');ctx.save();ctx.shadowColor='#24150c99';ctx.shadowBlur=8;ctx.shadowOffsetX=3;ctx.shadowOffsetY=6;ctx.fillStyle=g;ctx.strokeStyle='#464139';ctx.lineWidth=4;ctx.fill(p);ctx.stroke(p);ctx.restore();if(s>0){ctx.strokeStyle='#ead8b4';ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(b.x-20,b.y-21);ctx.lineTo(b.x-4,b.y-5);ctx.lineTo(b.x-14,b.y+17);ctx.moveTo(b.x-4,b.y-5);ctx.lineTo(b.x+20,b.y+12);if(s>1){ctx.moveTo(b.x+15,b.y-23);ctx.lineTo(b.x+5,b.y-6);ctx.lineTo(b.x+17,b.y+20)}ctx.stroke()}}
function draw(){drawGround();grains.forEach((g,i)=>{if(g.dug<1){ctx.globalAlpha=g.a*(1-g.dug);ctx.fillStyle=i%4===0?'#d6a661':i%4===1?'#5e3721':i%4===2?'#a76435':'#ca8a49';ctx.beginPath();ctx.ellipse(g.x,g.y,g.r*1.3,g.r*.72,(i%9)*.2,0,7);ctx.fill()}});ctx.globalAlpha=1;bones.forEach(b=>{drawBone(b);drawRock(b)})}
function localPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function say(t){statusbar.textContent=t;message.textContent=t;message.classList.add('show');clearTimeout(msgTimer);msgTimer=setTimeout(()=>message.classList.remove('show'),1200)}
function resetPanel(){fill.style.width='0%';pct.textContent='0%';stageLabel.textContent='骨を みつけよう！';almost.classList.remove('show')}
function updatePanel(b){if(!b||b.rockHP>0||b.found)return;const n=Math.round(b.clean);fill.style.width=n+'%';pct.textContent=n+'%';stageLabel.textContent=n<35?'① 濃い泥を おとそう':n<75?'② 薄い泥を おとそう':'③ 細かな汚れを おとそう';almost.classList.toggle('show',n>=80&&n<100)}
function tone(f=300,d=.04,v=.018){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d+.01)}catch(e){}}
function spawnFx(x,y,kind){const now=performance.now();if(now-lastFx<45)return;lastFx=now;const n=kind==='hammer'?5:3;for(let i=0;i<n;i++){const e=document.createElement('i');e.className='fx '+(kind==='hammer'?'rockfx':'sandfx');e.style.left=x+'px';e.style.top=y+'px';const a=-2.55+1.8*(i/Math.max(1,n-1))+(Math.random()-.5)*.2,d=(kind==='hammer'?34:20)+Math.random()*(kind==='hammer'?25:16);e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d+'px');e.style.setProperty('--rot',((Math.random()-.5)*220)+'deg');stage.appendChild(e);setTimeout(()=>e.remove(),600)}}
function shine(b){const e=document.createElement('div');e.className='glow';e.style.left=b.x+'px';e.style.top=b.y+'px';stage.appendChild(e);setTimeout(()=>e.remove(),820)}
function found(b){b.found=true;b.clean=100;shine(b);const n=bones.filter(x=>x.found).length;countEl.textContent=n;say('✨ ほね はっけん！ '+n+' / 8');tone(760,.12,.04);if(navigator.vibrate)navigator.vibrate(35);if(n===8)setTimeout(()=>complete.classList.add('open'),650);else setTimeout(resetPanel,500)}
function dig(x,y){spawnFx(x,y,tool);let touched=false,wrong='';grains.forEach(g=>{const d=Math.hypot(g.x-x,g.y-y);if(d<(tool==='brush'?24:18))g.dug=Math.min(1,g.dug+(tool==='brush'?.3:.08))});for(const b of bones){if(b.found)continue;const dist=Math.hypot(b.x-x,b.y-y);if(dist>58)continue;touched=true;if(b.rockHP>0){if(tool==='hammer'){const before=b.rockHP;b.rockHP=Math.max(0,b.rockHP-22);tone(95,.06,.035);if(navigator.vibrate)navigator.vibrate(15);if(before>70&&b.rockHP<=70)say('⚡ ヒビが はいった！');else if(before>35&&b.rockHP<=35)say('🔨 おおきな ヒビ！');else if(b.rockHP===0)say('💥 パカッ！ つぎはブラシ！')}else wrong='🪨 かたい岩は ハンマー！';break}if(tool==='hammer'){wrong='🦴 骨はブラシで やさしく！';break}b.clean=Math.max(b.clean,8);const ca=Math.cos(-b.angle),sa=Math.sin(-b.angle),dx=x-b.x,dy=y-b.y,lx=dx*ca-dy*sa,ly=dx*sa+dy*ca;let changed=false;for(let gy=0;gy<6;gy++)for(let gx=0;gx<8;gx++){const idx=gy*8+gx,cx=-35+gx*10,cy=-25+gy*10;if(!b.grid[idx]&&Math.hypot(cx-lx,cy-ly)<8){b.grid[idx]=true;changed=true}}const cleared=b.grid.reduce((s,v)=>s+(v?1:0),0);b.clean=Math.min(100,cleared/36*100);updatePanel(b);if(changed)tone(310+Math.min(150,b.clean),.025,.012);if(b.clean>=92)found(b);break}if(wrong)say(wrong);if(!touched)tone(tool==='hammer'?105:240,.03,.014);draw()}
function choose(t){tool=t;brushBtn.classList.toggle('selected',t==='brush');hammerBtn.classList.toggle('selected',t==='hammer');say(t==='brush'?'🖌️ ブラシで ゆっくり なぞろう！':'🔨 岩を たたいて ヒビをいれよう！')}
canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.setPointerCapture(e.pointerId);const p=localPoint(e);dig(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!dragging||tool!=='brush')return;const p=localPoint(e);dig(p.x,p.y)});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
brushBtn.onclick=()=>choose('brush');hammerBtn.onclick=()=>choose('hammer');document.querySelector('#hint').onclick=()=>{const b=bones.find(x=>!x.found);if(!b)return;if(b.rockHP>0){choose('hammer');say('💡 このあたりの岩を ハンマーで！')}else{choose('brush');say('💡 このあたりを ブラシで なぞろう！')}const e=document.createElement('div');e.className='glow';e.style.left=b.x+'px';e.style.top=b.y+'px';stage.appendChild(e);setTimeout(()=>e.remove(),700)};document.querySelector('#again').onclick=reset;window.addEventListener('resize',resize);requestAnimationFrame(resize);
})();
</script>
</body>
